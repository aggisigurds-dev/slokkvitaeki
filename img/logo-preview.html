<!doctype html>
<html lang="is">
<head>
  <meta charset="utf-8">
  <title>Logo preview — Slökkvitæki / Brunahólf</title>
  <style>
    body { margin:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:#f1f5f9; color:#0f172a; }
    .row { padding: 28px; }
    .row + .row { border-top: 1px solid #e2e8f0; }
    .light-bg { background: #fff; }
    .dark-bg  { background: #000; color: #fff; }
    h1 { margin:0 0 4px; font-size:14px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; }
    h1.on-dark { color:#94a3b8; }
    p  { margin:0 0 18px; font-size:12px; color:#64748b; }
    p.on-dark  { color:#94a3b8; }
    .sizes { display:flex; flex-wrap:wrap; gap:24px; align-items:center; }
    .label { font-size:11px; color:#64748b; margin-top:6px; text-align:center; }
    .label.on-dark { color:#94a3b8; }
    img.s1 { height:36px; }
    img.s2 { height:72px; }
    img.s3 { height:140px; }
  </style>
</head>
<body>

  <div class="row light-bg">
    <h1>logo-dark.svg · on white background</h1>
    <p>Use on receipts, light banners, white headers.</p>
    <div class="sizes">
      <div><img class="s1" src="logo-dark.svg" alt="dark logo small"><div class="label">36px</div></div>
      <div><img class="s2" src="logo-dark.svg" alt="dark logo medium"><div class="label">72px</div></div>
      <div><img class="s3" src="logo-dark.svg" alt="dark logo large"><div class="label">140px</div></div>
    </div>
  </div>

  <div class="row dark-bg">
    <h1 class="on-dark">logo-light.svg · on black background</h1>
    <p class="on-dark">Use on dark banners, splash, footer.</p>
    <div class="sizes">
      <div><img class="s1" src="logo-light.svg" alt="light logo small"><div class="label on-dark">36px</div></div>
      <div><img class="s2" src="logo-light.svg" alt="light logo medium"><div class="label on-dark">72px</div></div>
      <div><img class="s3" src="logo-light.svg" alt="light logo large"><div class="label on-dark">140px</div></div>
    </div>
  </div>

</body>
</html>
