<!doctype html>
<meta charset="utf-8">
<title>teikning-stjorn fixture</title>
<style>
.modal.open > .modal-hd { width: 560px !important; }
.modal.open { display: flex; }
</style>
<body>
<script>
window.U = { e: function (s) { return String(s == null ? '' : s); } };
window.Toast = { show: function () {} };
window.Modal = {
  open: function (id) {
    var el = document.getElementById(id);
    if (el) { el.classList.add('open'); el.style.display = 'flex'; }
  },
  close: function (id) {
    var el = document.getElementById(id);
    if (el) { el.classList.remove('open'); el.style.display = 'none'; }
  }
};
window.FloorPlan = {
  plans: {},
  companyId: null,
  companyName: null,
  units: [],
  bgImage: null,
  _selectedUnitId: null,
  __vistunSkreytt: true,
  open: function (cid, cname, units) {
    this.companyId = cid;
    this.companyName = cname || '';
    this.units = units || [];
    this.bgImage = null;
    var old = document.getElementById('modal-floorplan');
    if (old) old.remove();
    var div = document.createElement('div');
    div.className = 'modal';
    div.id = 'modal-floorplan';
    div.innerHTML =
      '<div class="modal-hd"><div><h2>Teikning — ' + this.companyName + '</h2></div>' +
      '<div style="display:flex;gap:8px;align-items:center">' +
      '<button type="button" class="fp-saekja-btn">Sækja teikningu</button>' +
      '<label class="btn">Hlaða upp<input type="file" style="display:none"></label>' +
      '<button type="button">Hreinsa</button>' +
      '<button type="button" class="modal-x">X</button></div></div>' +
      '<div class="modal-bd"><div id="fp-main"><canvas id="fp-canvas"></canvas></div>' +
      '<div id="fp-panel"><div>SLÖKKVITÆKI</div><div id="fp-unit-list"></div></div></div>' +
      '<div class="modal-ft"><button type="button">Loka</button><button type="button">Vista</button></div>';
    document.body.appendChild(div);
    Modal.open('modal-floorplan');
  },
  load: function () {},
  save: function () {},
  _renderCanvas: function () {},
  _renderPanel: function () {}
};
</script>
<script src="../js/patches/383-teikning-hreinsa-3d.js"></script>
</body>
