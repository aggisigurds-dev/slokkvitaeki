<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔥 Brunastál — útlits-sýnishorn (Sala)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  ::placeholder{color:rgba(20,24,34,.42)}
  #app{
    --accent:#c92a2a; --accent-2:#f0584c; --glow:rgba(160,16,16,.55); --ring:rgba(190,32,28,.55);
    --btn-grad:linear-gradient(145deg,#0d0102 0%,#380506 20%,#6c0d10 43%,#971515 53%,#420607 74%,#100102 100%);
    --plate:#eef1f6;
    --plate-img:linear-gradient(180deg,rgba(255,255,255,.9),rgba(20,30,60,.05)),repeating-linear-gradient(108deg,rgba(255,255,255,.5) 0 1px,transparent 1px 4px);
  }
  #app[data-theme="blue"]{ --accent:#5b86ff; --accent-2:#82a4ff; --glow:rgba(64,113,240,.5); --ring:rgba(110,155,255,.55);
    --btn-grad:linear-gradient(145deg,#03040a 0%,#0c1730 24%,#1d3c80 48%,#264c9e 56%,#0f2042 78%,#03060d 100%);}
  #app[data-theme="gold"]{ --accent:#d9af52; --accent-2:#e6c578; --glow:rgba(200,160,80,.46); --ring:rgba(200,160,80,.55);
    --btn-grad:linear-gradient(145deg,#120c03 0%,#332507 22%,#6f5318 44%,#9a7a2c 54%,#5a4314 74%,#181004 100%);}
  .nav{transition:background .15s,color .15s}
  .nav:hover{background:rgba(255,255,255,.06)!important;color:#fff!important}
  .tile{transition:border-color .18s,box-shadow .18s,transform .18s}
  .tile:hover{border-color:var(--ring)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 16px 34px -16px var(--glow)!important;transform:translateY(-3px)}
  .tile:active{transform:translateY(-1px) scale(.99)}
  .tile img{transition:transform .18s}
  .tile:hover img{transform:scale(1.07)}
  .mbtn{transition:filter .15s,border-color .15s}
  .mbtn:hover{filter:brightness(1.3);border-color:rgba(255,255,255,.2)!important}
  .abtn{transition:filter .15s,box-shadow .15s}
  .abtn:hover{filter:brightness(1.14);box-shadow:0 0 0 1px var(--ring),0 18px 38px -12px var(--glow)!important}
  .sw{width:28px;height:22px;border-radius:7px;cursor:pointer;padding:0;border:2px solid rgba(255,255,255,.18);opacity:.55}
  .sw.on{border:2px solid #fff;box-shadow:0 0 0 2px rgba(255,255,255,.18),0 6px 16px -6px #000;opacity:1}
</style>
</head>
<body>
<div id="app" data-theme="red" style="display:flex;min-height:100vh;width:100%;background:linear-gradient(180deg,#060607 0px,#060607 95px,#aeb4be 360px,#9ba1ad 100%);font-family:'Space Grotesk',system-ui,sans-serif;color:#cdd3da;">

  <!-- SIDEBAR -->
  <aside style="flex:none;width:230px;align-self:stretch;background:linear-gradient(180deg,#141519,#0c0d10);border-right:1px solid #050506;color:rgba(255,255,255,.6);display:flex;flex-direction:column;padding:0 0 14px;box-shadow:6px 0 24px -14px #000;">
    <div style="display:flex;align-items:center;gap:11px;padding:18px 18px 16px;border-bottom:1px solid #060708;">
      <div style="width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;background:#0a0b0d;border:1px solid #060708;box-shadow:inset 0 1px 0 rgba(255,255,255,.1);">
        <svg width="20" height="24" viewBox="0 0 36 48"><defs><linearGradient id="sbfl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd24a"/><stop offset=".4" stop-color="#ff7a1a"/><stop offset="1" stop-color="#e5231f"/></linearGradient></defs><path d="M18 3c1.6 6 8 8 8 17a8 8 0 0 1-16 0c0-2 .6-3.4 1.7-5 .3 3.2 2.4 4.2 3.2 3.2 1.3-1.6-1.6-5 3.1-15.4z" fill="url(#sbfl)"></path></svg>
      </div>
      <div style="min-width:0;">
        <div style="font-size:15px;font-weight:700;color:#eef1f4;line-height:1.1;">Slökkvitæki</div>
        <div style="font-size:11px;color:rgba(255,255,255,.4);margin-top:2px;">Slökkvitækjaþjónusta</div>
      </div>
    </div>
    <nav style="display:flex;flex-direction:column;gap:2px;padding:10px;font-size:13.5px;">
      <a class="nav" href="#" style="display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;color:#fff;text-decoration:none;background:var(--btn-grad);border:1px solid var(--ring);box-shadow:0 0 16px -4px var(--glow),inset 0 1px 0 rgba(255,255,255,.18);"><span style="width:7px;height:7px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 8px var(--accent-2);"></span><span style="flex:1;font-weight:600;">Sala</span></a>
      <a class="nav" href="#" style="display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:rgba(255,255,255,.62);text-decoration:none;"><span style="flex:1;">Afgreiðsla</span><span style="font-size:11px;font-weight:700;color:#0c0d10;background:#8a929e;padding:1px 8px;border-radius:20px;">102</span></a>
      <a class="nav" href="#" style="display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:rgba(255,255,255,.62);text-decoration:none;"><span style="flex:1;">Verkstæði</span><span style="font-size:11px;font-weight:700;color:#0c0d10;background:#8a929e;padding:1px 8px;border-radius:20px;">71</span></a>
      <a class="nav" href="#" style="display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:rgba(255,255,255,.62);text-decoration:none;"><span style="flex:1;">Fyrirtæki í Þjónustu</span></a>
      <a class="nav" href="#" style="display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:rgba(255,255,255,.62);text-decoration:none;"><span style="flex:1;">Rekstrarfélög</span></a>
      <a class="nav" href="#" style="display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:rgba(255,255,255,.62);text-decoration:none;"><span style="flex:1;">Allir Viðskiptavinir</span></a>
    </nav>
    <div style="margin-top:auto;padding:12px 16px 0;">
      <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.5);"><span style="width:8px;height:8px;border-radius:50%;background:#4fd08a;box-shadow:0 0 8px #4fd08a;"></span>Tengt</div>
    </div>
  </aside>

  <!-- MAIN -->
  <main style="flex:1;min-width:0;padding:20px 24px 40px;">
    <!-- STEEL BANNER -->
    <div style="position:relative;height:138px;border-radius:18px;margin-bottom:22px;padding:7px;background:linear-gradient(180deg,#26282d 0%,#121316 42%,#070708 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.14),inset 0 -4px 8px rgba(0,0,0,.85),0 24px 44px -18px #000,0 0 0 1px #000;">
      <div style="position:absolute;top:11px;left:11px;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9aa1ab,#26282d 70%);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 1px 2px #000;z-index:6;"></div>
      <div style="position:absolute;top:11px;right:11px;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9aa1ab,#26282d 70%);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 1px 2px #000;z-index:6;"></div>
      <div style="position:absolute;bottom:11px;left:11px;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9aa1ab,#26282d 70%);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 1px 2px #000;z-index:6;"></div>
      <div style="position:absolute;bottom:11px;right:11px;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9aa1ab,#26282d 70%);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 1px 2px #000;z-index:6;"></div>
      <div style="position:relative;height:100%;border-radius:12px;overflow:hidden;background:linear-gradient(180deg,#0c0d0f,#060607);box-shadow:inset 0 2px 8px rgba(0,0,0,.95),inset 0 -1px 0 rgba(255,255,255,.04);display:flex;align-items:center;gap:20px;padding:0 18px;">
        <div style="position:absolute;left:0;right:0;bottom:-2px;height:96px;z-index:1;pointer-events:none;background:url('../img/theme/fire-flames.png') repeat-x bottom left;background-size:auto 100%;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 30%);mask-image:linear-gradient(180deg,transparent 0%,#000 30%);"></div>
        <div style="position:relative;z-index:5;padding:8px 34px 8px 8px;margin-top:-12px;">
          <div style="position:absolute;inset:-12px -34px -12px -24px;background:radial-gradient(closest-side at 36% 50%,rgba(0,0,0,.74),transparent 80%);z-index:-1;"></div>
          <img src="../img/theme/brunaholf-mark.png" alt="Brunahólf" style="display:block;height:50px;width:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.7));">
          <div style="font-family:'Sora',sans-serif;font-weight:700;font-size:19px;letter-spacing:.14em;color:#fff;margin-top:7px;white-space:nowrap;text-shadow:0 2px 6px rgba(0,0,0,.85);">SLÖKKVITÆKI <span style="font-weight:500;color:rgba(255,255,255,.7);">EHF.</span></div>
        </div>
        <div style="flex:1;"></div>
        <div style="position:relative;z-index:5;text-align:right;">
          <div style="font-size:28px;font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.8);">Sala</div>
          <div style="font-family:'Space Mono',monospace;font-size:12px;color:rgba(255,255,255,.7);margin-top:4px;">Afgreiðslukerfi</div>
        </div>
        <div style="position:relative;z-index:5;display:flex;gap:6px;margin-left:18px;" id="sw">
          <button class="sw on" data-acc="red" title="Rautt" style="background:linear-gradient(145deg,#0d0102,#6c0d10 50%,#971515 60%,#100102);"></button>
          <button class="sw" data-acc="blue" title="Blátt" style="background:linear-gradient(145deg,#03040a,#1d3c80 52%,#264c9e 60%,#03060d);"></button>
          <button class="sw" data-acc="gold" title="Gyllt" style="background:linear-gradient(145deg,#0d0802,#5c4413 52%,#82661f 60%,#100b03);"></button>
        </div>
      </div>
    </div>
    <div style="position:relative;height:0;z-index:0;pointer-events:none;"><div style="position:absolute;left:8%;right:8%;top:-30px;height:66px;background:radial-gradient(62% 100% at 50% 0%,rgba(255,110,30,.32),rgba(255,80,20,.08) 55%,transparent 76%);filter:blur(13px);"></div></div>

    <!-- CONTENT -->
    <div style="display:flex;gap:20px;align-items:flex-start;">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:18px;">
        <!-- customer -->
        <div style="border-radius:16px;border:1px solid rgba(20,24,34,.08);background:#fff;box-shadow:0 10px 28px -16px rgba(25,35,60,.16);padding:18px 20px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;">
            <span style="font-size:14px;font-weight:700;letter-spacing:.12em;color:#3a4250;">VIÐSKIPTAVINUR</span>
            <button class="mbtn" style="display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:10px;border:1px solid #0a0b0d;background:linear-gradient(145deg,#08080a 0%,#26262c 26%,#3a3a41 50%,#19191d 74%,#070709 100%);color:#fff;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);">Skanna</button>
          </div>
          <div style="display:flex;gap:12px;">
            <input placeholder="Leita að kennitölu, nafni eða síma…" style="flex:1;height:50px;padding:0 16px;border-radius:12px;border:1px solid rgba(20,24,34,.14);background:#eef1f6;color:#141822;font-family:inherit;font-size:14.5px;outline:none;box-shadow:inset 0 2px 5px rgba(0,0,0,.35);">
            <button class="abtn" style="display:inline-flex;align-items:center;gap:8px;height:50px;padding:0 22px;border-radius:12px;border:1px solid var(--ring);background:var(--btn-grad);color:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 0 16px -4px var(--glow),inset 0 1px 0 rgba(255,255,255,.16);">Án kennitölu</button>
          </div>
        </div>
        <!-- ÞJÓNUSTA -->
        <div style="border-radius:16px;border:1px solid rgba(20,24,34,.08);background:#fff;box-shadow:0 10px 28px -16px rgba(25,35,60,.16);padding:18px 20px 22px;">
          <div style="font-size:14px;font-weight:700;letter-spacing:.12em;color:#3a4250;margin-bottom:14px;">ÞJÓNUSTA</div>
          <div id="svc" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:12px;"></div>
        </div>
        <!-- VÖRUR -->
        <div style="border-radius:16px;border:1px solid rgba(20,24,34,.08);background:#fff;box-shadow:0 10px 28px -16px rgba(25,35,60,.16);padding:18px 20px 22px;">
          <div style="font-size:14px;font-weight:700;letter-spacing:.12em;color:#3a4250;margin-bottom:14px;">VÖRUR</div>
          <div id="prod" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:12px;"></div>
        </div>
      </div>
      <!-- CART -->
      <div style="flex:none;width:360px;position:sticky;top:20px;border-radius:16px;border:1px solid rgba(255,255,255,.06);background:#14171d;box-shadow:0 18px 44px -24px #000;padding:20px;color:rgba(255,255,255,.85);">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
          <span style="font-size:15px;font-weight:700;letter-spacing:.12em;color:#7a8493;">KARFA</span>
          <div style="margin-left:auto;display:flex;gap:8px;">
            <button class="mbtn" style="height:32px;padding:0 12px;border-radius:9px;border:1px solid #0a0b0d;background:linear-gradient(145deg,#08080a 0%,#26262c 26%,#3a3a41 50%,#19191d 74%,#070709 100%);color:#fff;font-family:inherit;font-size:12.5px;cursor:pointer;">Annað</button>
            <button class="mbtn" style="height:32px;padding:0 12px;border-radius:9px;border:1px solid #0a0b0d;background:linear-gradient(145deg,#08080a 0%,#26262c 26%,#3a3a41 50%,#19191d 74%,#070709 100%);color:#fff;font-family:inherit;font-size:12.5px;cursor:pointer;">Bókhald</button>
          </div>
        </div>
        <div style="border:1px dashed rgba(255,255,255,.14);background:rgba(255,255,255,.03);border-radius:14px;padding:38px 16px;text-align:center;margin-bottom:18px;">
          <div style="font-size:14.5px;font-weight:600;color:rgba(255,255,255,.72);">Karfan er tóm</div>
          <div style="font-size:12.5px;color:rgba(255,255,255,.4);margin-top:4px;">Smelltu á flísar til að bæta við</div>
        </div>
        <div style="display:flex;justify-content:space-between;padding:16px 0;border-top:1px solid rgba(255,255,255,.1);">
          <span style="font-size:18px;font-weight:700;color:#fff;">Samtals</span>
          <span style="font-family:'Space Mono',monospace;font-size:22px;font-weight:700;color:#fff;">0 kr</span>
        </div>
        <button class="abtn" style="width:100%;height:54px;border-radius:14px;border:1px solid var(--ring);background:var(--btn-grad);color:#fff;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 0 18px -4px var(--glow),inset 0 1px 0 rgba(255,255,255,.18);">ÁFRAM</button>
      </div>
    </div>
  </main>
</div>

<script>
  var ICON = { b:'../img/theme/ic-b.png', r:'../img/theme/ic-r.png', rr:'../img/theme/ic-rr.png', g:'../img/theme/ic-g.png', gb:'../img/theme/ic-gb.png', br:'../img/theme/ic-br.png', y:'../img/theme/ic-y.png' };
  var SVC = [
    ['Duft 2 kg. ABC hleðsla','5.200 kr','4.194 kr','b'],
    ['Duft 6 kg. ABC hleðsla','8.410 kr','6.782 kr','b'],
    ['Duft 12 kg. ABC hleðsla','11.900 kr','9.597 kr','b'],
    ['Duft 6 kg. ABC yfirferð','4.200 kr','3.387 kr','b'],
    ['CO₂ 2 kg. hleðsla','4.216 kr','3.400 kr','r'],
    ['CO₂ 5 kg. hleðsla','8.556 kr','6.900 kr','r'],
    ['CO₂ 100 gr.','186 kr','150 kr','rr'],
    ['Léttvatnstæki 6kg. hleðsla','8.410 kr','6.782 kr','gb'],
    ['Froða 6 l. ABF hleðsla','18.340 kr','14.790 kr','g'],
    ['Skoðunargjald','2.500 kr','2.016 kr','shield'],
    ['Yfirferð Brunaslanga','5.389 kr','4.346 kr','br'],
    ['Yfirferð Reykskynjari','2.909 kr','2.346 kr','y']
  ];
  var PROD = [
    ['Duft 2 kg. ABC Slökkvitæki','8.500 kr','6.855 kr','b','376'],
    ['Duft 6 kg. ABC Slökkvitæki','13.500 kr','10.887 kr','b','218'],
    ['CO₂ 2 kg. Slökkvitæki','16.500 kr','13.306 kr','r','44'],
    ['CO₂ 5 kg. Slökkvitæki','29.500 kr','23.790 kr','r','0'],
    ['Léttvatn 6 kg. AB Slökkvitæki','14.500 kr','11.694 kr','gb','308'],
    ['ABF 6 l. Slökkvitæki','29.500 kr','23.790 kr','g','0'],
    ['Brunaslanga','74.400 kr','60.000 kr','br','10'],
    ['Reykskynjari','2.909 kr','2.346 kr','y','120']
  ];
  function shieldHTML(){
    return '<div style="width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,#9aa2af 0%,#5e6675 38%,#3f4654 62%,#23272f 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -4px 8px rgba(0,0,0,.4);">'+
      '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));"><path d="M12 3l7 3v5c0 4.4-3 6.9-7 8-4-1.1-7-3.6-7-8V6z"></path><path d="M9 12l2 2 4-4.2"></path></svg></div>';
  }
  function tile(r, stock){
    var ic = r[3], iconHTML;
    if(ic==='shield') iconHTML = shieldHTML();
    else iconHTML = '<img src="'+ICON[ic]+'" alt="" style="width:54px;height:54px;border-radius:14px;display:block;box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 7px 14px -6px rgba(20,30,60,.5);">';
    var stockHTML = (stock!=null) ? '<span style="position:absolute;top:8px;right:9px;font-family:\'Space Mono\',monospace;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#eef1f6;border:1px solid rgba(20,24,34,.1);color:'+(stock==='0'?'#d62626':'#5b6472')+';box-shadow:inset 0 1px 3px #000;">'+stock+'</span>' : '';
    return '<div class="tile" style="position:relative;border-radius:13px;border:1px solid rgba(20,24,34,.09);background-color:var(--plate);background-image:var(--plate-img);box-shadow:0 4px 12px -6px rgba(25,35,60,.12);padding:14px 12px 13px;text-align:center;cursor:pointer;">'+
      '<span class="mbtn" style="position:absolute;top:9px;left:9px;width:23px;height:23px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:#eef1f6;border:1px solid rgba(20,24,34,.1);color:#8a93a5;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg></span>'+
      stockHTML+
      '<div style="position:relative;width:54px;height:54px;margin:3px auto 12px;display:flex;align-items:center;justify-content:center;">'+iconHTML+'</div>'+
      '<div style="font-size:12.5px;line-height:1.3;color:#2a3340;min-height:32px;display:flex;align-items:center;justify-content:center;">'+r[0]+'</div>'+
      '<div style="font-family:\'Space Mono\',monospace;font-size:16px;font-weight:700;color:#11141c;margin-top:7px;">'+r[1]+'</div>'+
      '<div style="font-size:10.5px;color:#9098a6;margin-top:2px;font-family:\'Space Mono\',monospace;">'+r[2]+' án vsk</div>'+
    '</div>';
  }
  document.getElementById('svc').innerHTML = SVC.map(function(r){return tile(r,null);}).join('');
  document.getElementById('prod').innerHTML = PROD.map(function(r){return tile(r,r[4]);}).join('');
  document.getElementById('sw').addEventListener('click', function(e){
    var b = e.target.closest('button[data-acc]'); if(!b) return;
    document.getElementById('app').setAttribute('data-theme', b.dataset.acc);
    Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){ x.classList.toggle('on', x===b); });
  });
</script>
</body>
</html>
