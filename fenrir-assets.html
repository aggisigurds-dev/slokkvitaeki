:root{--gold:#ffba58;--red:#e5482e;--blue:#36aaff;--green:#5ef58a;--bg:#080a0e;--panel:#121720;--line:#6c492d;color-scheme:dark}*{box-sizing:border-box}body{margin:0;color:#f6e9d6;font:17px Rajdhani,Arial;background:radial-gradient(ellipse at 50% -20%,#8b321b75,transparent 55%),#07090d}body:before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(90deg,transparent 0 60px,#ffb13c08 61px),repeating-linear-gradient(0deg,transparent 0 60px,#ffb13c08 61px);pointer-events:none}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}aside{background:#090c12ee;border-right:1px solid #9c592d;padding:24px 15px;position:sticky;top:0;height:100vh;overflow:auto}h1,h2,h3{font-family:Cinzel,serif}h1{font-size:clamp(27px,4vw,46px);color:#ffd18c;margin:0;text-shadow:0 0 28px #ff74277a;letter-spacing:3px}h2{color:#ffcc87;font-size:23px}h3{font-size:16px;margin:8px 0 3px}.brand{font:800 28px Cinzel;color:var(--gold);letter-spacing:2px}.sub{letter-spacing:2px;color:#ab9685;font-size:12px}.nav{margin-top:28px;display:grid;gap:4px}.nav button,.filter button,.action{font:600 16px Rajdhani;background:transparent;color:#c8b7a3;border:1px solid transparent;padding:10px;text-align:left;cursor:pointer;border-radius:6px}.nav button.active,.nav button:hover,.filter button.active{background:#73321380;border-color:#b87337;color:#ffd08b}main{padding:30px clamp(14px,3vw,42px)}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.muted{color:#ad9b88}.pill{border:1px solid #af743c;border-radius:20px;padding:6px 12px;color:#ffcf8c}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:24px 0}.tools input,.tools select{background:#111820;border:1px solid #795738;color:white;border-radius:7px;padding:11px;font:16px Rajdhani;min-width:190px}.filter{display:flex;gap:6px;flex-wrap:wrap}.filter button{padding:8px 13px;border-color:#49372b}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.asset{background:linear-gradient(140deg,#171d27,#0b0d12);border:1px solid #76502f;border-radius:10px;overflow:hidden;box-shadow:0 10px 25px #0007;transition:transform .2s,border-color .2s}.asset:hover{transform:translateY(-3px);border-color:#f9aa4c}.preview{height:170px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(circle at center,#522716 0%,#111720 55%,#07090c)}.preview:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 75%,#07090c60)}.info{padding:12px}.info small{color:#aa9582;letter-spacing:1px}.row{display:flex;justify-content:space-between;align-items:center;gap:5px}.action{border-color:#73502e;padding:6px 10px;color:#ffc783;text-align:center}.action:hover{background:#713a19}.symbol{font-size:76px;filter:drop-shadow(0 0 16px currentColor)}.ring{width:124px;height:124px;border-radius:50%;border:4px solid var(--c);box-shadow:0 0 22px var(--c),inset 0 0 26px var(--c);display:grid;place-items:center;position:relative;animation:glow 3s infinite alternate}.ring:before{content:"";position:absolute;inset:10px;border:2px dashed var(--c);border-radius:50%;animation:spin 22s linear infinite}.ring:after{content:"";position:absolute;inset:23px;border:2px solid var(--c);border-radius:50%;opacity:.5}.ring span{font:800 20px Cinzel;color:var(--c);text-shadow:0 0 13px var(--c)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes glow{to{filter:brightness(1.4)}}.rune{font-size:95px;color:var(--c);text-shadow:0 0 18px var(--c)}.meter{width:78%;height:16px;background:#090b0f;border:1px solid var(--c);border-radius:8px;overflow:hidden;box-shadow:0 0 13px #000}.meter i{display:block;height:100%;background:linear-gradient(90deg,#6b2c0e,var(--c));box-shadow:0 0 20px var(--c)}.bars{display:flex;align-items:end;gap:4px;height:95px;width:80%}.bars i{flex:1;background:linear-gradient(var(--c),#a33a16);box-shadow:0 0 7px var(--c)}.buttonpreview{background:linear-gradient(120deg,#5c240d,var(--c),#5c240d);border:1px solid #ffe1a6;padding:15px 24px;border-radius:6px;box-shadow:0 0 22px var(--c);font:700 19px Cinzel;color:#fff}.badgepreview{padding:9px 19px;border:1px solid var(--c);border-radius:25px;color:var(--c);background:#080a0c;box-shadow:0 0 15px var(--c);font-weight:700}.cardpreview{width:82%;height:110px;border:1px solid var(--c);border-radius:9px;background:linear-gradient(130deg,#1e2630,#07090e);padding:15px;box-shadow:0 0 18px #000,inset 0 0 18px #ff8b1c17}.cardpreview b{font:700 16px Cinzel;color:var(--c)}.cardpreview strong{font-size:34px;display:block;color:white}.scene{width:100%;height:100%;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 25%,var(--c),transparent 20%),linear-gradient(145deg,#111827,#301510 70%,#07080a)}.scene:before{content:"";position:absolute;inset:30% -20% -20%;background:linear-gradient(145deg,transparent 42%,#11141a 43% 55%,transparent 56%),linear-gradient(30deg,transparent 42%,#17181b 43% 58%,transparent 59%),linear-gradient(165deg,transparent 35%,#2e1712 36% 56%,transparent 57%)}.scene:after{content:"";position:absolute;bottom:0;left:0;right:0;height:24%;background:repeating-linear-gradient(105deg,#ed5e1c 0 2px,#230c0a 4px 14px);filter:blur(5px)}.sigil{font:800 62px Cinzel;color:var(--c);text-shadow:0 0 20px var(--c);border:3px double var(--c);width:120px;height:120px;display:grid;place-items:center;transform:rotate(45deg);box-shadow:0 0 15px var(--c)}.sigil span{transform:rotate(-45deg)}.palette{width:85%;height:95px;border-radius:8px;background:linear-gradient(120deg,var(--c),#08090c);border:1px solid #fff4}.count{font:800 52px Rajdhani;color:var(--c);text-shadow:0 0 20px var(--c)}.wolf{font-size:85px;filter:drop-shadow(0 0 16px var(--c))}.empty{padding:30px;color:#c9b5a1}dialog{max-width:700px;width:90vw;background:#0d121a;color:#f8ead6;border:1px solid #cc823e;border-radius:12px;padding:20px}dialog::backdrop{background:#000c}.detail{display:grid;grid-template-columns:1fr 1fr;gap:20px} </style></head><body><div class="layout"><aside><div class="brand">ᚠ FENRIR</div><div class="sub">RAGNARÖK ASSET VAULT</div><nav class="nav" id="nav"></nav><p class="muted">Reusable UI assets · v1.0</p><a href="fenrir.html" style="color:#ffbd69">← FENRIR Dashboard</a></aside><main><header><div><h1>ASSET VAULT</h1><div class="muted">FENRIR DESIGN SYSTEM · RAGNARÖK COLLECTION</div></div><span class="pill" id="quantity">0 ASSETS</span></header><div class="tools"><input id="search" placeholder="Leita að asset..." aria-label="Search assets"><select id="tone"><option value="all">Allir litir</option><option value="#ffb34d">Gull / Eldur</option><option value="#e5482e">Rauður / Hætta</option><option value="#36aaff">Blár / Kjarni</option><option value="#5ef58a">Grænn / Virkur</option><option value="#d5dbe6">Silfur / Aska</option></select><button class="action" id="export">↓ Export asset manifest</button></div><div class="filter" id="filter"></div><section class="gallery" id="gallery"></section></main></div><dialog id="dialog"><button class="close" id="close">✕ Loka</button><h2 id="detailtitle"></h2><div class="detail"><div class="preview" id="detailpreview"></div><div><p id="detailtext"></p><p><b>Asset ID</b><br><code id="detailid"></code></p><p><b>CSS color token</b><br><code id="detailcolor"></code></p><button class="action" id="copy">Afrita asset ID</button></div></div></dialog><script>
const groups=[
['Wolves / Varðhundar','wolf',['Fenrir Alpha','Odin Sentinel','Thor Stormwolf','Freyja Moonwolf','Loki Emberwolf','Heimdall Watcher','Mímir Oracle','Baldur Guardian','Höðr Shadow','Tyr Warwolf','Skadi Frostwolf','Vidar Ironwolf','Vali Tracker','Ragnarök Beast','Ashen Wolf','Eclipse Wolf','Chainbreaker','Volcanic Howler','Ghost Wolf','Midnight Sentinel']],

['Norse Runes','rune',['Fehu','Uruz','Thurisaz','Ansuz','Raidho','Kenaz','Gebo','Wunjo','Hagalaz','Nauthiz','Isa','Jera','Eihwaz','Perthro','Algiz','Sowilo','Tiwaz','Berkano','Ehwaz','Mannaz','Laguz','Ingwaz','Dagaz','Othala']],
['Apocalyptic Scenes','scene',['Molten Valley','Blood Eclipse','Thunder Peaks','Ashfall','Volcanic Horizon','Obsidian Mountains','Frost Apocalypse','Hellfire Ridge','Black Sun','Stormfront','Magma River','Doomsday Sky','Burning Fortress','Runic Wasteland','Wolf Mountain']],
['Gauges & Meters','meter',['System Health','Reaction Load','Threat Level','Guard Energy','Alert Pressure','CPU Watch','Event Throughput','Memory Load','Network Pulse','Activity Surge','Security Shield','Heartbeat','Response Velocity','Risk Index','Reset Progress']],
['Telemetry Charts','bars',['Reaction Histogram','Event Spike','24 Hour Trend','Alert Frequency','Guard Performance','Heat Index','Live Activity','Throughput Bars','Response Timeline','System Load']],
['Buttons & Controls','button',['Primary Command','Reset Counter','Critical Reset','Activate Guard','Standby','Deploy','Confirm','Warning','Inspect','Launch','Scan','Reconnect','Open Portal','Export','Refresh']],
['Status Indicators','badge',['Online','Active','Critical','Warning','Offline','Standby','Syncing','Armed','Shielded','Unverified','Demo Mode','Monitoring','Overloaded','Protected','Ready']],
['Command Cards','card',['Guard Card','Counter Tile','System Status','Threat Card','Event Summary','Latency Tile','Network Card','Daily Activity','System Uptime','Critical Alert','Reaction Total','Reset History']],
['Norse Sigils','sigil',['Fenrir Mark','Odin Seal','Thor Hammer','World Serpent','Ragnarök Gate','Guard Crest','Runic Shield','Valhalla Crest','Black Sun Crest','Wolf Pact']],
['Color Materials','palette',['Molten Gold','Hellfire Orange','Blood Red','Ice Blue','Venom Green','Ash Silver','Obsidian','Charcoal','Ember Copper','Ancient Bronze']]
];
const colors=['#ffb34d','#e5482e','#36aaff','#5ef58a','#d5dbe6'];const runes='ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛋᛏᛒᛖᛗᛚᛜᛞᛟ';const assets=groups.flatMap(([category,type,names],gi)=>names.map((name,i)=>({id:'fenrir-'+(gi+1)+'-'+String(i+1).padStart(3,'0'),category,type,name,color:colors[(i+gi)%colors.length],i})));let current='Allir',query='',tone='all',selected=null;const $=id=>document.getElementById(id);const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','&#39;':'&#39;'}[c]));function preview(a){const c=a.color;const style='style="--c:'+c+'"';switch(a.type){case'wolf':return '<div class="wolf" '+style+'>'+(['🐺','🐺','🐺','🐺','🐺'][a.i%5])+'</div>';case'ring':return '<div class="ring" '+style+'><span>ᚠ</span></div>';case'rune':return '<div class="rune" '+style+'>'+runes[a.i%runes.length]+'</div>';case'scene':return '<div class="scene" '+style+'></div>';case'meter':return '<div class="meter" '+style+'><i style="width:'+(20+(a.i*13)%76)+'%"></i></div>';case'bars':return '<div class="bars" '+style+'>'+Array.from({length:20},(_,i)=>'<i style="height:'+(10+(i*17+a.i*11)%88)+'%"></i>').join('')+'</div>';case'button':return '<div class="buttonpreview" '+style+'>'+escape(a.name)+'</div>';case'badge':return '<div class="badgepreview" '+style+'>● '+escape(a.name)+'</div>';case'card':return '<div class="cardpreview" '+style+'><b>'+escape(a.name)+'</b><strong>'+((a.i+1)*327).toLocaleString('is-IS')+'</strong><small>ᚠ FENRIR SYSTEM</small></div>';case'sigil':return '<div class="sigil" '+style+'><span>'+runes[(a.i*3)%runes.length]+'</span></div>';case'palette':return '<div class="palette" '+style+'></div>'}return ''}function render(){const filtered=assets.filter(a=>(current==='Allir'||a.category===current)&&(tone==='all'||a.color===tone)&&(a.name+' '+a.category+' '+a.id).toLowerCase().includes(query));$('quantity').textContent=filtered.length+' / '+assets.length+' ASSETS';$('gallery').innerHTML=filtered.map(a=>'<article class="asset"><div class="preview">'+preview(a)+'</div><div class="info"><small>'+escape(a.category)+'</small><h3>'+escape(a.name)+'</h3><div class="row"><small>'+a.id+'</small><button class="action" data-id="'+a.id+'">Skoða ↗</button></div></div></article>').join('')||'<p class="empty">Engin assets fundust.</p>'}function categories(){const all=['Allir',...groups.map(g=>g[0])];$('nav').innerHTML=all.map(c=>'<button data-cat="'+escape(c)+'" class="'+(c===current?'active':'')+'">'+escape(c)+'</button>').join('');$('filter').innerHTML=all.map(c=>'<button data-cat="'+escape(c)+'" class="'+(c===current?'active':'')+'">'+escape(c)+'</button>').join('')}function choose(c){current=c;categories();render()}$('nav').onclick=$('filter').onclick=e=>{const b=e.target.closest('[data-cat]');if(b)choose(b.dataset.cat)};$('search').oninput=e=>{query=e.target.value.trim().toLowerCase();render()};$('tone').onchange=e=>{tone=e.target.value;render()};$('gallery').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;selected=assets.find(a=>a.id===b.dataset.id);$('detailtitle').textContent=selected.name;$('detailpreview').innerHTML=preview(selected);$('detailtext').textContent=selected.category+' — reusable Fenrir design concept. Visuals are CSS-based prototypes, not production illustration files.';$('detailid').textContent=selected.id;$('detailcolor').textContent=selected.color;$('dialog').showModal()};$('close').onclick=()=>$('dialog').close();$('copy').onclick=()=>navigator.clipboard?.writeText(selected.id);$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:'1.0',system:'FENRIR Ragnarök',assets},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='fenrir-assets-manifest.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};categories();render();
</script></body></html>
