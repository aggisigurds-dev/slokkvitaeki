<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Rýmingaráætlun</title>
<style>
:root{--ink:#1d2329;--mut:#66717c;--line:#dfe3e8;--bg:#eef0f3;--paper:#fff;--acc:#c8321e;--ok:#1f7a4a;--warn:#a8670f;--bad:#c8321e}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.bar{position:sticky;top:0;z-index:20;background:#1d2329;color:#fff;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:9px 16px}
.bar .brand{font-weight:700;margin-right:6px;letter-spacing:.01em}
.bar .brand b{color:#ff7a62}
.bar select,.bar button{font-size:14px;border:0;border-radius:6px;padding:7px 11px;background:#2f3942;color:#fff;cursor:pointer}
.bar select{max-width:260px}
.bar button:hover,.bar select:hover{background:#3d4954}
.bar button.save{background:#1f7a4a;font-weight:600}
.bar button.save:hover{background:#18633c}
.bar button.save.dirty{background:#c98a12}
.fab{position:fixed;right:18px;bottom:18px;z-index:30;border:0;border-radius:999px;background:#1f7a4a;color:#fff;font-weight:700;padding:12px 20px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;font-size:15px}
.fab.dirty{background:#c98a12}
.bar button.send{background:#2f3942;border:1px solid #5b6875}
.bar button.send:hover{background:#3d4954}
.sendt{font-size:12px;color:var(--mut);margin-top:6px}
.sd-bak{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.sd{background:#fff;border-radius:12px;width:min(520px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.sd-h{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);background:#f7f8fa;font-weight:700}
.sd-h small{font:700 9.5px/1.5 ui-monospace,monospace;border:1px solid currentColor;border-radius:3px;padding:0 5px;margin-left:8px;opacity:.6}
.sd-b{padding:14px 18px}
.sd-b label{display:block;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:10px 0 4px}
.sd-b input,.sd-b select,.sd-b textarea{width:100%;border:1px solid #cbd5e1;border-radius:7px;padding:8px 10px;font-size:14px;background:#fff}
.sd-b textarea{resize:vertical;overflow:auto;min-height:120px}
.sd-f{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:#f7f8fa}
.sd-f button{border:1px solid #cbd5e1;background:#fff;border-radius:7px;padding:8px 14px;cursor:pointer;font-size:13px}
.sd-f button.go{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.sd-f button:disabled{opacity:.6;cursor:default}
.sd-msg{font-size:12px;margin-top:10px;color:var(--mut)}
.bar button.pri{background:var(--acc)}
.bar button.pri:hover{background:#b02a17}
.bar .coname{font-size:14px;color:#cfd6dd;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar a.barlink{font-size:14px;border-radius:6px;padding:7px 11px;background:#2f3942;color:#fff;text-decoration:none}
.bar a.barlink:hover{background:#3d4954}
.bar .sep{width:1px;height:22px;background:#3d4954;margin:0 4px}
.bar .sp{flex:1}
.bar .status{font-size:13px;color:#aab4bd}
.wrap{max-width:900px;margin:20px auto 60px;padding:0 12px}
.missing{background:#fff;border-left:4px solid var(--acc);border-radius:6px;padding:12px 16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.missing.done{border-left-color:var(--ok)}
.missing h3{margin:0 0 8px;font-size:14px}
.missing .chips{display:flex;flex-wrap:wrap;gap:6px}
.missing .chip{border:1px solid #f0c9c2;background:#fdf1ef;color:#8c2414;border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
.missing .chip:hover{background:#fbe2dd}
.page{background:var(--paper);padding:40px 48px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kicker{color:var(--acc);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
input,textarea{width:100%;border:1px solid transparent;border-radius:5px;background:transparent;padding:6px 8px;outline:none}
input:hover,textarea:hover{border-color:var(--line)}
input:focus,textarea:focus{border-color:var(--acc);background:#fffaf9}
textarea{resize:none;overflow:hidden;display:block}
textarea.herbtexti{min-height:110px;border:1px solid var(--line);background:#fafbfc}
::placeholder{color:#b3bac1}
.h1{font-size:28px;font-weight:750;padding:2px 6px;margin-left:-6px;letter-spacing:-.01em}
.hsub{font-size:18px;color:var(--mut);padding:2px 6px;margin-left:-6px}
.metaline{display:flex;gap:16px;color:var(--mut);font-size:13px;margin:4px 0 6px}
section{margin-top:30px}
h2{display:flex;align-items:center;gap:10px;font-size:18px;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
h2 .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;font-size:13px}
h4{margin:14px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px}
.f{display:block}
.f>span{display:block;font-size:12px;color:var(--mut);padding:0 8px;margin-top:6px}
.f input{font-weight:600}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600}
td{border-bottom:1px solid var(--line);padding:2px;vertical-align:top}
td.c{width:120px;padding-top:5px}
td.x{width:30px;text-align:center}
.rowdel{border:0;background:none;color:#b3bac1;cursor:pointer;font-size:18px;line-height:1;padding:6px}
.rowdel:hover{color:var(--bad)}
select.st{border:0;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;cursor:pointer;width:100%}
.st-til{background:#e4f3ea;color:var(--ok)}
.st-vinnsla{background:#fcf0dc;color:var(--warn)}
.st-vantar{background:#fbe6e2;color:var(--bad)}
.add{margin-top:8px;border:1px dashed #c5ccd3;background:none;border-radius:6px;padding:6px 12px;color:var(--mut);cursor:pointer;font-size:13px}
.add:hover{border-color:var(--acc);color:var(--acc)}
.adds{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--mut);margin:0 0 8px}
.draw{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.slot{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}
.slot.over,.addslot.over{outline:2px solid var(--acc);outline-offset:2px}
.slot .ttl{font-weight:600}
.box{aspect-ratio:4/3;border-radius:6px;display:grid;place-items:center;overflow:hidden;background:#f7f8fa}
.box img{width:100%;height:100%;object-fit:contain;background:#fff;cursor:zoom-in}
.empty{border:2px dashed #c5ccd3;cursor:pointer;color:var(--mut);text-align:center;font-size:13px;padding:10px}
.empty:hover{border-color:var(--acc);color:var(--acc)}
.plus{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 8px;border-radius:50%;border:2px solid currentColor;font-size:32px;font-weight:300;line-height:1}
.tools{display:flex;gap:6px;margin-top:6px}
.tools button{flex:1;border:1px solid var(--line);background:#fff;border-radius:5px;padding:4px;font-size:12px;cursor:pointer;color:var(--mut)}
.tools button:hover{border-color:var(--acc);color:var(--acc)}
.addslot{border:2px dashed #c5ccd3;border-radius:8px;display:grid;place-items:center;min-height:230px;cursor:pointer;color:var(--mut);text-align:center;font-size:14px;background:none}
.addslot:hover{border-color:var(--acc);color:var(--acc)}
.cover{background:#fff;aspect-ratio:210/297;display:flex;flex-direction:column;margin-bottom:14px;overflow:hidden;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cv-top{display:flex;align-items:center;justify-content:space-between;padding:30px 44px}
.cv-logo{position:relative;min-height:56px;display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:6px}
.cv-logo img{max-height:72px;max-width:260px;display:block}
.cv-logo small{color:var(--mut);border:1px dashed #c5ccd3;border-radius:5px;padding:2px 8px}
.cv-logo:hover small{border-color:var(--acc);color:var(--acc)}
.cv-word{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:.16em}
.cv-word i{width:16px;height:30px;background:var(--acc);border-radius:2px;display:block;transform:skewX(-12deg)}
.cv-toplabel{color:var(--mut);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.cv-hero{position:relative;background:#1d2329;color:#fff;padding:46px 44px 40px;border-bottom:8px solid var(--acc)}
.cv-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:22px}
.cv-row .cv-addr{margin-top:0}
.cv-year{font-size:56px;font-weight:800;line-height:.9;color:#ff7a62;letter-spacing:-.02em}
.cv-kicker{color:#ff7a62;font-weight:700;font-size:13px;letter-spacing:.18em;text-transform:uppercase}
.cv-h1{font-size:54px;line-height:1.05;margin:10px 0 12px;font-weight:800;letter-spacing:-.02em}
.cv-sub{color:#aab4bd;font-size:16px}
.cv-addr{font-size:30px;font-weight:700;margin-top:22px}
.cv-photo{position:relative;flex:1 1 auto;margin:28px 44px 0;border-radius:8px;overflow:hidden;min-height:120px;cursor:pointer;display:grid;place-items:center}
.cv-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv-photo.noimg{border:2px dashed #c5ccd3;color:var(--mut);text-align:center;font-size:13px;background:#f7f8fa}
.cv-photo.noimg:hover{border-color:var(--acc);color:var(--acc)}
.cv-x{position:absolute;top:6px;right:6px;z-index:2;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:16px;line-height:1}
.cv-logo .cv-x{top:-8px;right:-14px}
.cv-info{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 24px;padding:28px 44px}
.cv-info div span{display:block}
.cv-info .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600}
.cv-info .v{font-size:16px;font-weight:650;margin-top:3px}
.cv-info .v.red{color:var(--acc);font-size:20px}
.cv-toc{padding:4px 44px 24px}
.cv-toc .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600;padding-top:16px;border-top:1px solid var(--line)}
.cv-toc ol{columns:2;column-gap:24px;margin:10px 0 0;padding-left:22px;font-size:14px;line-height:1.9}
.cv-toc li::marker{color:var(--acc);font-weight:700}
.cv-foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 44px;display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px;gap:12px}
.cv-foot input{width:230px;display:inline-block;font-weight:600;color:var(--ink);padding:3px 6px}
.cv-logo img{max-height:84px}
@media (max-width:640px){.cv-year{font-size:36px}.cv-top,.cv-hero,.cv-info,.cv-foot{padding-left:18px;padding-right:18px}.cv-photo{margin:18px 18px 0}.cv-h1{font-size:34px}.cv-addr{font-size:22px}.cv-info{grid-template-columns:1fr 1fr}.cover{aspect-ratio:auto}}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:14px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:50;cursor:zoom-out;padding:20px}
.zoom img{max-width:100%;max-height:100%;background:#fff}
.busy{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1d2329;color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;display:none;z-index:40}
@media (max-width:640px){.page{padding:22px 16px}.grid{grid-template-columns:1fr}.h1{font-size:22px}}
@media print{
  @page{size:A4;margin:14mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cover{aspect-ratio:auto;height:268mm;box-shadow:none;margin:0;border-radius:0;break-after:page}
  .cv-photo.noimg,.cv-x,.cv-logo small{display:none!important}
  .cv-foot input{border:0!important;padding:0!important}
  body{background:#fff;font-size:12.5px}
  .bar,.fab,.missing,.foot,.sendt,.sd-bak,.rowdel,.add,.adds,.addslot,.tools,.hint,.slot.noimg,td.x,th.x,.zoom,.busy{display:none!important}
  .wrap{max-width:none;margin:0;padding:0}
  .page{box-shadow:none;padding:0;border-radius:0}
  input,textarea,select{border:0!important;background:none!important;padding:3px 4px!important;-webkit-appearance:none;appearance:none}
  ::placeholder{color:transparent}
  select.st{background:none!important;padding:3px 0!important}
  section{break-inside:avoid}
  section.long{break-inside:auto}
  .drawsec{break-before:page}
  .draw{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
  .slot{border:0;padding:0;break-inside:avoid}
  .box{aspect-ratio:auto;background:none;height:118mm;display:flex;align-items:center;justify-content:center}
  .box img{width:100%;height:100%;max-height:118mm;object-fit:contain}
  .slot .ttl{font-size:12px}
}
</style>
</head>
<body>
<div class="bar">
  <span class="brand">🔥 Rýmingar<b>áætlun</b></span>
  <span class="coname" id="coname"></span>
  <a class="barlink" id="profill" href="/" target="_blank" rel="noopener">Prófíll</a>
  <span class="sep"></span>
  <button class="save" data-act="save">💾 Vista</button>
  <button class="pri" data-act="print">Prenta / PDF</button>
  <button class="send" data-act="senda">📧 Senda</button>
  <span class="sp"></span>
  <span class="status" id="status"></span>
</div>

<div class="wrap">
  <div class="missing" id="missing"></div>
  <div class="cover" id="cover"></div>
  <div class="page" id="doc"></div>
  <div class="foot">Vistast í gagnagrunni Slökkvitækja — sama áætlun á öllum tölvum og í síma. Vistast sjálfkrafa og með Vista-takkanum.</div>
</div>

<input type="file" id="fimg" accept="image/*,application/pdf" multiple hidden>
<button class="fab" data-act="save" id="fab">💾 Vista</button>
<div class="zoom" id="zoom"><img alt=""></div>
<div class="busy" id="busy"></div>

<script src="/js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const BRUNA_LOGO='/rymingaraetlun/brunaholf-slokkvitaeki-logo.png';
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const today=()=>{const d=new Date();return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear()};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=v=>!String(v??'').trim();
const ST={til:'Til',vinnsla:'Í vinnslu',vantar:'Vantar'};
const META=[['heimilisfang','Heimilisfang'],['rekstraradili','Rekstraraðili'],['abyrgdaradili','Ábyrgðaraðili'],['simi','Símanúmer ábyrgðaraðila'],['herbergi','Fjöldi herbergja'],['gestir','Hámarksfjöldi gesta']];

const ROW={
  gogn:()=>({t:'',s:'vantar',n:''}),
  vidbrogd:()=>({h:'',a:''}),
  vidhald:()=>({t:'',a:'',s:'vantar'}),
  herb:()=>({nr:'',haed:'',adal:'',vara:''})
};

function template(){return{
  id:uid(),updated:Date.now(),
  titill:'Brunavarna- og rýmingaráætlun',
  meta:{heimilisfang:'',rekstraradili:'',abyrgdaradili:'',simi:'',herbergi:'',gestir:'',dags:today(),utgafa:'1.0'},
  gogn:[
    {t:'Grunnteikning af hverri hæð með merktum flóttaleiðum, stigum utandyra og söfnunarstað utandyra',s:'vantar',n:''},
    {t:'Staðsetning brunaviðvörunarkerfis og brunaboða',s:'vantar',n:''},
    {t:'Staðsetning slökkvitækja, brunaslanga og eldvarnarteppa',s:'vantar',n:''},
    {t:'Herbergjalisti með aðal- og varaflóttaleið úr hverju herbergi',s:'vantar',n:''}],
  vidbrogd:[{h:'Hver ræsir viðvörun',a:''},{h:'Hver hringir í 112',a:''},{h:'Hver tekur á móti slökkviliði',a:''}],
  ryming:{regla:'Gestir fyrst, eftir nálægð við eld, síðan aðrir.',gestalisti:'',simi:''},
  vidhald:[
    {t:'Æfingar og þjálfun starfsfólks',a:'',s:'vantar'},
    {t:'Leiðbeiningar til gesta á íslensku og ensku í herbergjum og á göngum',a:'',s:'vantar'},
    {t:'Slökkvitæki og brunaslöngur – árleg skoðun',a:'',s:'vantar'},
    {t:'Brunaviðvörunarkerfi – prófanir og þjónusta',a:'',s:'vantar'},
    {t:'Neyðarlýsing og flóttaleiðamerkingar – prófun',a:'',s:'vantar'}],
  herb:[],
  herbTexti:'',
  teikn:[{title:'Grunnteikning – 1. hæð',img:null},{title:'Grunnteikning – 2. hæð',img:null},{title:'Brunakerfi og brunaboðar',img:null}],
  ath:'',
  cover:{logo:BRUNA_LOGO,photo:null,vinna:'Brunahólf Slökkvitæki ehf'}
}}
function norm(p){if(!p.cover)p.cover={logo:BRUNA_LOGO,photo:null,vinna:'Brunahólf Slökkvitæki ehf'};if(p.herbTexti==null)p.herbTexti='';return p}
const yearOf=d=>((String(d||'').match(/(19|20)\d{2}/)||[])[0])||String(new Date().getFullYear());


/* ---------- gagnagrunnur (Supabase: tafla rymingaraetlun, ein röð á fyrirtæki) ---------- */
let sb=null;try{sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_KEY)}catch(e){}
const CID=Number(new URLSearchParams(location.search).get('fyrirtaeki'))||0;
let P=null,timer=null,uppfaert=null,vistar=false,aftur=false,fyr=null;
const label=p=>p.meta.heimilisfang||p.titill||'Rýmingaráætlun';
function setStatus(t){$('#status').textContent=t}
function dirty(on){document.querySelectorAll('[data-act="save"]').forEach(b=>{b.classList.toggle('dirty',on);b.textContent=on?'💾 Vista breytingar':'💾 Vista'})}
function touch(){clearTimeout(timer);setStatus('Óvistað…');dirty(true);timer=setTimeout(save,1500)}
async function save(){
  clearTimeout(timer);timer=null;
  if(!sb||!CID)return;
  if(vistar){aftur=true;return}
  vistar=true;setStatus('Vistar…');
  const nu=new Date().toISOString();let r;
  try{
    if(!uppfaert) r=await sb.from('rymingaraetlun').insert({company_id:CID,efni:P,updated_at:nu,updated_by:'rymingaraetlun'}).select('updated_at');
    else r=await sb.from('rymingaraetlun').update({efni:P,updated_at:nu,updated_by:'rymingaraetlun'}).eq('company_id',CID).eq('updated_at',uppfaert).select('updated_at');
    if(r.error){ if(/duplicate|23505/i.test((r.error.message||'')+(r.error.code||''))) setStatus('⚠ Breytt á annarri vél — endurhlaðið síðuna'); else setStatus('⚠ Vistaðist ekki: '+r.error.message); }
    else if(!r.data||!r.data.length) setStatus('⚠ Breytt á annarri vél — endurhlaðið síðuna');
    else{uppfaert=r.data[0].updated_at;const d=new Date();setStatus('Vistað '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'));dirty(false)}
  }catch(e){setStatus('⚠ Vistaðist ekki')}
  vistar=false;if(aftur){aftur=false;save()}
}
window.addEventListener('beforeunload',e=>{if(timer||vistar){e.preventDefault();e.returnValue=''}});
/* myndir í storage (sama fata og teikningar appsins) */
async function hladaUpp(dataUrl,png){
  if(!sb||!CID)throw new Error('engin tenging');
  const blob=await (await fetch(dataUrl)).blob();
  const slod='rymingaraetlun/'+CID+'/'+uid()+(png?'.png':'.jpg');
  const up=await sb.storage.from('turbopaint').upload(slod,blob,{contentType:png?'image/png':'image/jpeg',upsert:false,cacheControl:'31536000'});
  if(up.error)throw up.error;
  return sb.storage.from('turbopaint').getPublicUrl(slod).data.publicUrl;
}

/* ---------- paths ---------- */
function getPath(path){return path.split('.').reduce((o,k)=>o?.[k],P)}
function setPath(path,v){const ks=path.split('.');let o=P;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks.at(-1)]=v}

/* ---------- render ---------- */

function grow(t){t.style.height='auto';t.style.height=t.scrollHeight+'px'}

function missing(){const m=[],p=P;
  META.forEach(([k,l])=>{if(blank(p.meta[k]))m.push([l,'meta.'+k])});
  p.gogn.forEach((g,i)=>{if(g.s!=='til')m.push([(g.t||'Atriði').slice(0,48)+(g.t.length>48?'…':'')+' – '+ST[g.s].toLowerCase(),`gogn.${i}.s`])});
  p.vidbrogd.forEach((r,i)=>{if(blank(r.a))m.push([r.h||'Viðbragðshlutverk',`vidbrogd.${i}.a`])});
  if(blank(p.ryming.simi))m.push(['Símanúmer vegna gestalista','ryming.simi']);
  p.vidhald.forEach((r,i)=>{if(r.s!=='til')m.push([(r.t||'Atriði').slice(0,48)+' – '+ST[r.s].toLowerCase(),`vidhald.${i}.s`])});
  p.teikn.forEach((t,i)=>{if(!t.img)m.push(['Teikning: '+(t.title||'án heitis'),`teikn.${i}.title`])});
  return m}
function sendtHtml(){const s=(P&&P.sendingar)||[];if(!s.length)return'';const x=s[s.length-1];return '<div class="sendt">📧 Síðast sent '+esc(dagsTimi(x.dags))+' til '+esc(x.til)+(s.length>1?' · '+s.length+' sendingar alls':'')+'</div>'}
function dagsTimi(iso){const d=new Date(iso);if(isNaN(d))return'';const z=n=>String(n).padStart(2,'0');return z(d.getDate())+'.'+z(d.getMonth()+1)+'.'+d.getFullYear()+' kl. '+z(d.getHours())+':'+z(d.getMinutes())}
function refreshMissing(){const m=missing(),el=$('#missing');
  el.classList.toggle('done',!m.length);
  el.innerHTML=(m.length?`<h3>Vantar til að klára (${m.length})</h3><div class="chips">${m.map(([l,p])=>`<button class="chip" data-act="goto" data-p="${p}">${esc(l)}</button>`).join('')}</div>`:`<h3>✓ Allt komið – tilbúið til prentunar</h3>`)+sendtHtml()}

    const hae=prompt('Hæð (má sleppa)')||'';

    render();touch()}
  else if(a==='pick'){pickTarget=b.dataset.i;$('#fimg').value='';$('#fimg').click()}

/* ---------- drawings ---------- */
function busy(t){const b=$('#busy');b.textContent=t||'';b.style.display=t?'block':'none'}
const MAXPX=3000;
function imgToData(file,png){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const sc=Math.min(1,MAXPX/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');
    c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);const x=c.getContext('2d');if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);res(png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.9))};
  im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
let pdfjsP=null;
function loadPdfjs(){if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  return pdfjsP||(pdfjsP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res(window.pdfjsLib)};
    s.onerror=()=>{pdfjsP=null;rej()};document.head.appendChild(s)}))}
async function pdfToImages(file){const lib=await loadPdfjs();const doc=await lib.getDocument({data:await file.arrayBuffer()}).promise;const out=[];
  for(let i=1;i<=doc.numPages;i++){busy(`Les PDF… bls. ${i} af ${doc.numPages}`);const pg=await doc.getPage(i);const v0=pg.getViewport({scale:1});
    const v=pg.getViewport({scale:Math.min(4,MAXPX/Math.max(v0.width,v0.height))});const c=document.createElement('canvas');c.width=Math.round(v.width);c.height=Math.round(v.height);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:x,viewport:v}).promise;out.push(c.toDataURL('image/jpeg',.9))}
  return out}
async function addFiles(files,target){if(!files.length)return;const items=[];
  for(const f of files){const base=f.name.replace(/\.[^.]+$/,'');
    try{if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){busy('Les PDF…');const pages=await pdfToImages(f);pages.forEach((img,i)=>items.push({title:pages.length>1?`${base} – bls. ${i+1}`:base,img}))}
      else if(f.type.startsWith('image/')){busy('Les mynd…');items.push({title:base,img:await imgToData(f,target==='logo')})}
      else alert('„'+f.name+'“ er hvorki mynd né PDF.')}
    catch(err){alert(/pdf$/i.test(f.name)?'Gat ekki lesið PDF-skrána „'+f.name+'“. Til að lesa PDF þarf tölvan að vera nettengd (í fyrsta skipti). Annars má vista teikninguna sem mynd (PNG/JPG) og setja hana inn.':'Gat ekki lesið „'+f.name+'“.')}}
  if(items.length){busy('Vista mynd…');try{for(const it of items){it.img=await hladaUpp(it.img,target==='logo')}}catch(e){busy('');alert('Myndin vistaðist ekki: '+(e.message||e));return}}
  busy('');if(!items.length)return;
  if(target==='logo'||target==='photo'){P.cover[target]=items[0].img}
  else if(target!=null&&target!=='new'&&P.teikn[+target]){const i=+target,s=P.teikn[i];s.img=items[0].img;if(blank(s.title))s.title=items[0].title;P.teikn.splice(i+1,0,...items.slice(1))}
  else P.teikn.push(...items);
  render();touch()}

let _h2p=null;
function loadH2P(){if(window.html2pdf)return Promise.resolve();return _h2p||(_h2p=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.2/dist/html2pdf.bundle.min.js';s.onload=res;s.onerror=()=>{_h2p=null;rej(new Error('Gat ekki hlaðið PDF-einingu'))};document.head.appendChild(s)}))}
function skraarnafn(){return ('Rymingaraetlun-'+(label(P)||'')).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[ðÐ]/g,'d').replace(/[þÞ]/g,'th').replace(/[æÆ]/g,'ae').replace(/[^\w-]+/g,'-').replace(/-+/g,'-').replace(/-$/,'')+'.pdf'}
function myndSem(url){
  return fetch(url,{mode:'cors',cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.blob()}).then(bl=>new Promise((res,rej)=>{
    const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
      // Minnkað í prentgæði (lengsta hlið 1500 px, JPEG 0,75) svo PDF-ið komist í póst (~6 MB hámark sendingarþjónustunnar).
      const k=Math.min(1,1500/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      res({data:c.toDataURL('image/jpeg',.75),w:c.width,h:c.height,fmt:'JPEG'})};im.onerror=()=>rej(new Error('mynd las ekki'));im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(bl)}));
}
// Raðar teikningum á síður svo hver sjáist ALLTAF heil (object-fit: contain):
//  liggjandi (b/h ≥ 1,15) → tvær á síðu, hvor undir annarri · mjög há (b/h < 0,55) → ein á síðu · annað → fjórar (2×2).
function rodaTeikningum(myndir){
  const teg=m=>{const a=m.w/m.h;return a>=1.15?'half':a<0.55?'full':'quarter'};
  const per={half:2,quarter:4,full:1},sidur=[];let nu=null;
  myndir.forEach(m=>{const t=teg(m);if(!nu||nu.teg!==t||nu.items.length>=per[t]){nu={teg:t,items:[]};sidur.push(nu)}nu.items.push(m)});
  return sidur;
}
function hlutar(teg,i,top){
  const L=10,B=190,H=287-top,g=5;           // mm: vinstri spássía, breidd, hæð sem er eftir á síðunni, bil
  if(teg==='full')return{x:L,y:top,w:B,h:H};
  if(teg==='half'){const hh=(H-g)/2;return{x:L,y:top+i*(hh+g),w:B,h:hh}}
  const ww=(B-g)/2,hh=(H-g)/2;return{x:L+(i%2)*(ww+g),y:top+Math.floor(i/2)*(hh+g),w:ww,h:hh};
}
async function teiknaTeikningar(pdf,stada){
  const lis=P.teikn.filter(t=>t.img);if(!lis.length)return;
  const myndir=[];
  for(let i=0;i<lis.length;i++){if(stada)stada('Sæki teikningu '+(i+1)+' af '+lis.length+'…');
    try{const m=await myndSem(lis[i].img);m.title=lis[i].title||'';myndir.push(m)}catch(e){myndir.push({villa:true,title:(lis[i].title||'')+' (mynd náðist ekki)',w:4,h:3})}}
  rodaTeikningum(myndir).forEach((sida,si)=>{
    pdf.addPage('a4','portrait');
    let top=10;
    if(si===0){pdf.setFillColor(200,50,30);pdf.circle(13.5,15,3.6,'F');pdf.setTextColor(255,255,255);pdf.setFont('helvetica','bold');pdf.setFontSize(9);pdf.text('8',13.5,16.3,{align:'center'});
      pdf.setTextColor(29,35,41);pdf.setFontSize(14);pdf.text('Teikningar',19.5,17);pdf.setDrawColor(29,35,41);pdf.setLineWidth(.6);pdf.line(10,21,200,21);top=26}
    sida.items.forEach((m,i)=>{
      const c=hlutar(sida.teg,i,top);
      pdf.setFont('helvetica','bold');pdf.setFontSize(sida.teg==='quarter'?9:11);pdf.setTextColor(29,35,41);
      pdf.text(pdf.splitTextToSize(m.title,c.w)[0]||'',c.x,c.y+4);
      const by=c.y+6.5,bh=c.h-6.5;
      if(m.villa){pdf.setDrawColor(200,50,30);pdf.rect(c.x,by,c.w,bh);return}
      const s=Math.min(c.w/m.w,bh/m.h),dw=m.w*s,dh=m.h*s;
      pdf.addImage(m.data,m.fmt,c.x+(c.w-dw)/2,by+(bh-dh)/2,dw,dh,undefined,'FAST');
    });
  });
}
async function pdfBase64(stada){
  await loadH2P();
  const holder=document.createElement('div');holder.style.cssText='position:fixed;left:-10000px;top:0;background:#fff';holder.innerHTML=pdfHtml();document.body.appendChild(holder);
  // html2canvas teiknar autt ef síðunni hefur verið skrunað (forsíða og kaflar urðu auðir, mælt 14.10.2026) — skruna efst á meðan.
  const sx=window.scrollX,sy=window.scrollY;
  try{
    window.scrollTo(0,0);
    await Promise.all([...holder.querySelectorAll('img')].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r})));
    if(stada)stada('Bý til forsíðu og kafla…');
    const pdf=await window.html2pdf().set({margin:[10,10,10,10],filename:skraarnafn(),image:{type:'jpeg',quality:.88},html2canvas:{scale:1.6,useCORS:true,backgroundColor:'#ffffff',scrollX:0,scrollY:0},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy'],before:'.pb',avoid:['.avoid']}}).from(holder.firstChild).toPdf().get('pdf');
    // auð síða sem html2pdf skilur stundum eftir í lokin
    const n=pdf.internal.getNumberOfPages();if(n>1){try{const ops=pdf.internal.pages[n];if(ops&&ops.filter(x=>/\bDo\b|Tj|TJ/.test(x)).length===0)pdf.deletePage(n)}catch(_){}}
    await teiknaTeikningar(pdf,stada);
    return String(pdf.output('datauristring')).split(',')[1]||'';
  }finally{holder.remove();window.scrollTo(sx,sy)}
}

      const url=URL.createObjectURL(new Blob([u8],{type:'application/pdf'}));const a=document.createElement('a');a.href=url;a.download=skraarnafn();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);stada('')}

      stada('Bý til PDF…');const b64=await pdfBase64(stada);if(!b64)throw new Error('Tókst ekki að búa til PDF.');

      try{localStorage.setItem('slokk_send_from','Brunahólf slökkvitæki ehf <'+fra+'>')}catch(_){}
