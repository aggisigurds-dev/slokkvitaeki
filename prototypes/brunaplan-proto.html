<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brunavarnaáætlun — teiknari</title>
<style>
  :root{
    --bg:#eef1f4; --panel:#fff; --ink:#1c2430; --line:#c8d0da; --wall:#2a3340;
    --room:#f7f9fb; --room-soft:#eef4f2; --sub:#6b7686; --accent:#c9982f;
    --red:#e0392b; --green:#1f9d55; --blue:#2b6cb0; --yellow:#e0b400;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:9px 12px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
  .brand{font-weight:700;font-size:15px;letter-spacing:.02em}
  .brand small{font-weight:500;color:var(--sub);font-size:11px;margin-left:6px}
  .sp{flex:1}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 11px;font:600 12.5px system-ui;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
  .hint{font-size:11.5px;color:var(--sub)}
  .palette{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);align-items:center}
  .pal-lbl{font:700 10px system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--sub);margin-right:4px}
  .pal-item{display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 8px;cursor:pointer;min-width:64px}
  .pal-item:hover{border-color:var(--accent);background:#fffdf6}
  .pal-item .glyph{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700}
  .pal-item small{font-size:9.5px;color:var(--sub);text-align:center;line-height:1.1}
  .stage{padding:22px;display:flex;justify-content:center;overflow:auto}
  .plan{position:relative;width:1040px;height:660px;background:
      linear-gradient(#fff,#fff),
      repeating-linear-gradient(0deg,rgba(120,140,160,.10) 0 1px,transparent 1px 26px),
      repeating-linear-gradient(90deg,rgba(120,140,160,.10) 0 1px,transparent 1px 26px);
    background-blend-mode:normal;border:3px solid var(--wall);border-radius:2px;box-shadow:0 10px 30px rgba(20,30,45,.12)}
  .room{position:absolute;background:var(--room);border:2px solid var(--wall);display:flex;align-items:flex-start;justify-content:flex-start;overflow:hidden}
  .room .rname{padding:6px 9px;font:600 13px system-ui;color:var(--ink);cursor:text;white-space:nowrap}
  .room .rgrip{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:se-resize;background:
      linear-gradient(135deg,transparent 45%,var(--accent) 45% 60%,transparent 60%)}
  .room .rx{position:absolute;right:2px;top:2px;width:18px;height:18px;border:0;background:transparent;color:var(--sub);cursor:pointer;font-size:13px;line-height:1;display:none}
  .room:hover .rx{display:block}
  .room.drag,.pl-icon.drag{outline:2px dashed var(--accent);outline-offset:1px}
  .pl-icon{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:grab;user-select:none;touch-action:none}
  .pl-icon .glyph{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:17px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .pl-icon small{font-size:9px;color:#33404f;background:rgba(255,255,255,.75);padding:0 3px;border-radius:3px;white-space:nowrap}
  .pl-icon .ix{position:absolute;right:-7px;top:-7px;width:16px;height:16px;border-radius:50%;border:0;background:#fff;color:var(--red);box-shadow:0 1px 3px rgba(0,0,0,.3);cursor:pointer;font-size:11px;line-height:1;display:none}
  .pl-icon:hover .ix{display:block}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 15px;border-radius:9px;font:500 12px system-ui;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200}
  .toast.show{opacity:1}
  @media print{
    .top,.palette,.toast{display:none!important}
    .stage{padding:0}
    body{background:#fff}
    .plan{box-shadow:none}
    .room .rx,.room .rgrip,.pl-icon .ix{display:none!important}
  }
</style>
</head>
<body>
  <div class="top">
    <span class="brand">◧ Brunavarnaáætlun <small>teiknari · frumgerð</small></span>
    <span class="hint">Dragðu rými og tákn · horn til að stækka · tvísmelltu á nafn</span>
    <span class="sp"></span>
    <button class="btn" id="add-room">+ Rými</button>
    <button class="btn pri" id="print">Prenta / PDF</button>
    <button class="btn" id="reset">Núllstilla</button>
  </div>
  <div class="palette" id="palette"><span class="pal-lbl">Tákn</span></div>
  <div class="stage"><div class="plan" id="plan"></div></div>
  <div class="toast" id="toast"></div>
<script>
(function(){
  "use strict";
  var LS='brunaplan_v1';
  function $(s,r){return (r||document).querySelector(s);}
  function uid(){return 'x'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  // Fire-safety symbols (matches a standard brunavarnaáætlun legend).
  var ICONS={
    slokk:{lbl:'Slökkvitæki',col:'var(--red)',g:'🧯'},
    reyk:{lbl:'Reykskynjari',col:'var(--red)',g:'◉'},
    hnappur:{lbl:'Brunaboði',col:'var(--red)',g:'▣'},
    slanga:{lbl:'Slöngukefli',col:'var(--red)',g:'⊚'},
    skyndi:{lbl:'Skyndihjálp',col:'var(--blue)',g:'✚'},
    flotti:{lbl:'Flóttaleið',col:'var(--green)',g:'⇥'},
    utgangur:{lbl:'Aðalútgangur',col:'var(--green)',g:'⤒'},
    tafla:{lbl:'Rafmagnstafla',col:'var(--yellow)',g:'⚡'}
  };

  function seed(){return {
    rooms:[
      {id:uid(),name:'Anddyri',x:20,y:20,w:200,h:180},
      {id:uid(),name:'Skrifstofur',x:230,y:20,w:330,h:180},
      {id:uid(),name:'Fundarherbergi',x:570,y:20,w:450,h:180},
      {id:uid(),name:'Tölvurými',x:20,y:210,w:200,h:170},
      {id:uid(),name:'Lager',x:230,y:210,w:150,h:170},
      {id:uid(),name:'Kaffistofa',x:390,y:210,w:230,h:170},
      {id:uid(),name:'Snyrting',x:630,y:210,w:150,h:170},
      {id:uid(),name:'Tæknirými',x:790,y:210,w:230,h:170},
      {id:uid(),name:'Verkstæði',x:20,y:390,w:290,h:250},
      {id:uid(),name:'Gangur / flóttaleið',x:320,y:390,w:320,h:250},
      {id:uid(),name:'Bílgeymsla',x:650,y:390,w:370,h:250}
    ],
    icons:[
      {id:uid(),type:'slokk',x:60,y:150},
      {id:uid(),type:'reyk',x:360,y:70},
      {id:uid(),type:'hnappur',x:250,y:250},
      {id:uid(),type:'skyndi',x:470,y:250},
      {id:uid(),type:'reyk',x:470,y:430},
      {id:uid(),type:'tafla',x:880,y:250},
      {id:uid(),type:'slokk',x:60,y:430},
      {id:uid(),type:'flotti',x:470,y:560},
      {id:uid(),type:'utgangur',x:360,y:610}
    ]
  };}

  var state;
  try{state=JSON.parse(localStorage.getItem(LS));}catch(e){}
  if(!state||!state.rooms)state=seed();

  var plan=$('#plan');

  function persist(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}

  function makeDrag(el,obj,onEnd){
    el.addEventListener('pointerdown',function(e){
      if(e.target.closest('.rgrip,.rx,.ix'))return;
      if(e.target.classList&&e.target.classList.contains('rname')&&e.target.isContentEditable)return;
      e.preventDefault();
      var sx=e.clientX,sy=e.clientY,ox=obj.x,oy=obj.y;
      el.classList.add('drag');el.setPointerCapture(e.pointerId);
      function mv(ev){obj.x=Math.max(0,ox+(ev.clientX-sx));obj.y=Math.max(0,oy+(ev.clientY-sy));el.style.left=obj.x+'px';el.style.top=obj.y+'px';}
      function up(ev){el.classList.remove('drag');el.releasePointerCapture(e.pointerId);el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);persist();if(onEnd)onEnd();}
      el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);
    });
  }

  function renderRoom(r){
    var el=document.createElement('div');el.className='room';el.style.cssText='left:'+r.x+'px;top:'+r.y+'px;width:'+r.w+'px;height:'+r.h+'px';
    el.innerHTML='<div class="rname">'+esc(r.name)+'</div><button class="rx" title="Eyða">✕</button><div class="rgrip"></div>';
    plan.appendChild(el);
    makeDrag(el,r);
    // rename
    var nm=el.querySelector('.rname');
    nm.addEventListener('dblclick',function(){nm.contentEditable='true';nm.focus();document.execCommand&&document.getSelection&&document.getSelection().selectAllChildren(nm);});
    nm.addEventListener('blur',function(){nm.contentEditable='false';r.name=nm.textContent.trim()||'Rými';nm.textContent=r.name;persist();});
    nm.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();nm.blur();}});
    // delete
    el.querySelector('.rx').addEventListener('click',function(){state.rooms=state.rooms.filter(function(x){return x.id!==r.id;});el.remove();persist();});
    // resize
    var grip=el.querySelector('.rgrip');
    grip.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();var sx=e.clientX,sy=e.clientY,ow=r.w,oh=r.h;grip.setPointerCapture(e.pointerId);
      function mv(ev){r.w=Math.max(60,ow+(ev.clientX-sx));r.h=Math.max(50,oh+(ev.clientY-sy));el.style.width=r.w+'px';el.style.height=r.h+'px';}
      function up(){grip.releasePointerCapture(e.pointerId);grip.removeEventListener('pointermove',mv);grip.removeEventListener('pointerup',up);persist();}
      grip.addEventListener('pointermove',mv);grip.addEventListener('pointerup',up);});
  }

  function renderIcon(ic){
    var def=ICONS[ic.type]||ICONS.slokk;
    var el=document.createElement('div');el.className='pl-icon';el.style.cssText='left:'+ic.x+'px;top:'+ic.y+'px';
    el.innerHTML='<button class="ix" title="Eyða">✕</button><div class="glyph" style="background:'+def.col+'">'+def.g+'</div><small>'+esc(def.lbl)+'</small>';
    plan.appendChild(el);
    makeDrag(el,ic);
    el.querySelector('.ix').addEventListener('click',function(){state.icons=state.icons.filter(function(x){return x.id!==ic.id;});el.remove();persist();});
  }

  function renderAll(){plan.innerHTML='';state.rooms.forEach(renderRoom);state.icons.forEach(renderIcon);}

  // palette
  var pal=$('#palette');
  Object.keys(ICONS).forEach(function(type){
    var def=ICONS[type];
    var b=document.createElement('button');b.className='pal-item';
    b.innerHTML='<span class="glyph" style="background:'+def.col+'">'+def.g+'</span><small>'+esc(def.lbl)+'</small>';
    b.onclick=function(){var ic={id:uid(),type:type,x:plan.clientWidth/2-15,y:plan.clientHeight/2-15};state.icons.push(ic);renderIcon(ic);persist();toast(def.lbl+' — dragðu á sinn stað');};
    pal.appendChild(b);
  });

  $('#add-room').onclick=function(){var r={id:uid(),name:'Nýtt rými',x:40,y:40,w:200,h:150};state.rooms.push(r);renderRoom(r);persist();toast('Rými bætt við');};
  $('#print').onclick=function(){window.print();};
  $('#reset').onclick=function(){if(!confirm('Núllstilla teikningu og byrja með dæmið?'))return;try{localStorage.removeItem(LS);}catch(e){}location.reload();};

  var toEl=$('#toast'),toT=null;function toast(m){toEl.textContent=m;toEl.classList.add('show');clearTimeout(toT);toT=setTimeout(function(){toEl.classList.remove('show');},2400);}

  renderAll();
})();
</script>
</body>
</html>
