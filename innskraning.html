<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Innskráning — Slökkvitæki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Innskráning Slökkvitækis — Brunastál (málmhaus, stálplata, rautt málmmerki). Sama notendaskrá og Brunahólf (/api/hub-adgangar). */
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#060607 0,#060607 95px,#aeb4be 360px,#9ba1ad 100%);background-attachment:fixed;color:#11141c;font-family:"IBM Plex Sans",system-ui,sans-serif}
button,input{font:inherit}
header{height:95px;padding:0 48px;display:flex;align-items:center;flex:none}
header span{font-weight:600;font-size:20px;letter-spacing:.22em;color:#fff}
main{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:56px 20px 72px}
.plata{width:100%;max-width:560px;padding:14px 14px 18px;border-radius:14px;border:1px solid #000;background:repeating-linear-gradient(108deg,rgba(255,255,255,.34) 0 1px,transparent 1px 4px),linear-gradient(180deg,#e8ebf0,#dce1e8);box-shadow:0 12px 30px -16px rgba(0,0,0,.55)}
.spjald{border-radius:12px;border:1px solid #000;background:#fff;overflow:hidden;box-shadow:0 18px 40px -12px rgba(10,14,22,.5),0 2px 6px rgba(10,14,22,.12)}
.haus{position:relative;height:46px;padding:5px 20px 5px 28px;display:flex;align-items:center;gap:12px;background:linear-gradient(145deg,#08080a 0%,#26262c 26%,#3a3a41 50%,#19191d 74%,#070709 100%);border-bottom:1px solid #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.haus i{position:absolute;top:50%;margin-top:-3px;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f4f6f8 0%,#aab1bb 40%,#3b3f46 100%);box-shadow:0 1px 1px rgba(0,0,0,.7)}
.haus i:first-child{left:8px}.haus i:nth-child(2){right:8px}
.haus h1{margin:0;font-weight:600;font-size:15px;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.5)}
.plata-merki{margin-left:auto;height:22px;padding:0 8px;display:inline-flex;align-items:center;border-radius:3px;border:1px solid rgba(20,24,34,.12);background:linear-gradient(180deg,#fdfdfe,#e3e7ee);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.1);color:#11141c;font:700 10.5px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase}
form{padding:22px 24px 18px;display:flex;flex-direction:column;gap:20px}
.meta{margin:0;font-size:13.5px;line-height:1.45;color:#3a4250}
.litil{font-size:12px;color:#5b6472}
.fld{display:flex;flex-direction:column;gap:10px}
.lbl{display:flex;align-items:center;gap:8px;font:700 11px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#2b313c}
.lbl svg{width:15px;height:15px;color:#971515}
.reitur{display:flex;align-items:center;gap:8px;height:44px;padding:0 2px 0 12px;border-radius:8px;border:1px solid rgba(20,24,34,.14);background:#eef1f6;box-shadow:inset 0 2px 5px rgba(0,0,0,.18);color:#141822}
.reitur:focus-within{box-shadow:inset 0 2px 5px rgba(0,0,0,.18),0 0 0 2px #c92a2a}
.reitur svg{width:16px;height:16px;flex:none;color:#525b6b}
.reitur input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;font-size:15px;color:#141822}
.reitur input::placeholder{color:#5b6472}
.reitur.nn input{font-family:"JetBrains Mono",monospace;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.reitur.nn input::placeholder{font-family:"IBM Plex Sans",system-ui,sans-serif;font-weight:400;letter-spacing:0;text-transform:none}
.reitur.villa{border-color:#b42318;box-shadow:inset 0 2px 5px rgba(0,0,0,.18),0 0 0 1px #b42318}
.augad{height:38px;padding:0 10px;border-radius:6px;border:1px solid rgba(20,24,34,.16);background:linear-gradient(180deg,#fdfdfe,#e3e7ee);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.1);color:#11141c;font:700 10.5px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.augad svg{width:15px;height:15px;color:#2b313c}
.go{width:100%;height:46px;border-radius:10px;border:1px solid #0a0b0d;background:linear-gradient(145deg,#0d0102 0%,#380506 20%,#6c0d10 43%,#971515 53%,#420607 74%,#100102 100%);color:#fff;font-weight:600;font-size:15px;text-shadow:0 1px 1px rgba(0,0,0,.5);box-shadow:0 0 16px -4px rgba(160,16,16,.55),inset 0 1px 0 rgba(255,255,255,.16);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.go:hover{filter:brightness(1.12)}.go:active{transform:scale(.99)}.go:disabled{opacity:.38;pointer-events:none}
.go svg{width:16px;height:16px}
.alt{width:100%;height:44px;border-radius:10px;border:1px solid rgba(20,24,34,.16);background:linear-gradient(180deg,#fdfdfe,#e3e7ee);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 1px 2px rgba(0,0,0,.1);color:#11141c;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px}
.lnk{border:0;background:transparent;padding:10px 8px;min-height:44px;font-weight:600;font-size:13px;color:#2b313c;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.lnk:hover{color:#c92a2a}
.fot{margin:0 24px 14px;border-top:1.5px dashed rgba(20,24,34,.22);padding-top:4px;display:flex;justify-content:center}
.villa-texti{display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:600;color:#b42318}
.eye:focus-visible,.go:focus-visible,.alt:focus-visible,.lnk:focus-visible,.augad:focus-visible{outline:none;box-shadow:inset 0 0 0 2px #c92a2a}
.sent{padding:26px 24px 24px;display:flex;flex-direction:column;gap:18px}
.sent .kv{display:flex;align-items:center;gap:12px;font-weight:600;font-size:16px}
.sent .kv span{width:40px;height:40px;flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#3d4048,#1c1e23);border:1px solid #000;color:#3cc47c;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
@media (max-width:700px){header{padding:0 16px;height:72px}header span{font-size:16px}main{padding:28px 16px 40px}}
</style>
</head>
<body>
<header><span>SLÖKKVITÆKI EHF.</span></header>
<main>
  <div class="plata"><section class="spjald">
    <div class="haus"><i></i><i></i><h1 id="titill">Innskráning</h1><span class="plata-merki">Starfsmenn</span></div>
    <div id="inni" aria-live="polite"></div>
  </section></div>
</main>

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var USER = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>';
  var LOCK = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
  var MAIL = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>';
  var EYE = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var ARR = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  var WARN = '<svg viewBox="0 0 24 24" aria-hidden="true" width="16" height="16" style="flex:none;margin-top:1px" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>';

  function api(method, body) {
    var opt = { method: method, headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', cache: 'no-store' };
    if (body) opt.body = JSON.stringify(body);
    return fetch('/api/hub-adgangar', opt).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j._status = r.status; return j; }); });
  }
  // endurvarp: aðeins slóð á þessum vef (byrjar á /, ekki //)
  function nextUrl() {
    var n = new URLSearchParams(location.search).get('next');
    return (n && n.charAt(0) === '/' && n.charAt(1) !== '/' && n.charAt(1) !== '\\' && n.indexOf('innskraning.html') === -1) ? n : '/';
  }
  function setTitle(t) { $('#titill').textContent = t; document.title = t + ' — Slökkvitæki'; }

  function innskraning(msg) {
    setTitle('Innskráning');
    $('#inni').innerHTML =
      '<form id="f" novalidate><p class="meta">Sláðu inn notandanafn og lykilorð.</p>' +
      '<div class="fld"><label class="lbl" for="nn">' + USER + 'Notandanafn</label><div class="reitur nn" id="rnn"><input id="nn" type="text" maxlength="6" autocomplete="username" autocapitalize="characters" placeholder="Skammstöfun" aria-describedby="nnh"></div><div class="litil" id="nnh">Notandanafnið er skammstöfunin þín, til dæmis AS.</div></div>' +
      '<div class="fld"><label class="lbl" for="pw">' + LOCK + 'Lykilorð</label><div class="reitur" id="rpw"><input id="pw" type="password" autocomplete="current-password" placeholder="Sláðu inn lykilorð"><button type="button" class="augad" id="eye" aria-pressed="false" aria-label="Sýna lykilorð">' + EYE + '<span>Sýna</span></button></div><div id="e"></div></div>' +
      '<button class="go" type="submit">Skrá inn ' + ARR + '</button></form>' +
      '<div class="fot"><button class="lnk" id="gl" type="button">Gleymt lykilorð?</button></div>';
    if (msg) $('#e').innerHTML = '<div class="villa-texti" role="alert">' + WARN + esc(msg) + '</div>';
    $('#eye').addEventListener('click', function () { var i = $('#pw'), show = i.type === 'password'; i.type = show ? 'text' : 'password'; this.setAttribute('aria-pressed', show); $('span', this).textContent = show ? 'Fela' : 'Sýna'; });
    $('#gl').addEventListener('click', gleymt);
    $('#nn').addEventListener('input', function () { this.value = this.value.toUpperCase(); });
    $('#f').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var nn = $('#nn').value, pw = $('#pw').value;
      if (!nn || !pw) { $('#rpw').classList.add('villa'); $('#e').innerHTML = '<div class="villa-texti" role="alert">' + WARN + 'Sláðu inn notandanafn og lykilorð.</div>'; return; }
      var b = $('#f .go'); b.disabled = true;
      api('POST', { action: 'login', nn: nn, password: pw }).then(function (j) {
        if (j.ok) { location.replace(nextUrl()); return; }
        b.disabled = false; $('#rpw').classList.add('villa');
        $('#e').innerHTML = '<div class="villa-texti" role="alert">' + WARN + esc(j.error || 'Innskráning mistókst.') + '</div>';
      }).catch(function () { b.disabled = false; $('#e').innerHTML = '<div class="villa-texti" role="alert">' + WARN + 'Næ ekki sambandi við þjóninn.</div>'; });
    });
  }

  function gleymt() {
    setTitle('Gleymt lykilorð');
    $('#inni').innerHTML =
      '<form id="f" novalidate><p class="meta">Sláðu inn póstfangið þitt. Við sendum þér notandanafnið og lykilorðið í tölvupósti.</p>' +
      '<div class="fld"><label class="lbl" for="pf">' + MAIL + 'Póstfang</label><div class="reitur">' + MAIL + '<input id="pf" type="email" autocomplete="email" placeholder="Póstfang"></div></div>' +
      '<button class="go" type="submit">Senda í tölvupósti ' + ARR + '</button></form>' +
      '<div class="fot"><button class="lnk" id="bk" type="button">Til baka í innskráningu</button></div>';
    $('#bk').addEventListener('click', function () { innskraning(); });
    $('#f').addEventListener('submit', function (ev) {
      ev.preventDefault(); var pf = $('#pf').value.trim(); if (!pf) return;
      var b = $('#f .go'); b.disabled = true;
      api('POST', { action: 'gleymt', postfang: pf }).then(function (j) {
        $('#inni').innerHTML = '<div class="sent"><div class="kv"><span aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>Tölvupóstur sendur</div>' +
          '<p class="meta">' + esc((j && j.skilabod) || 'Ef póstfangið er skráð sendum við notandanafn og lykilorð þangað.') + ' Athugaðu líka ruslpóstinn.</p><button class="alt" id="bk2" type="button">Til baka í innskráningu</button></div>';
        $('#bk2').addEventListener('click', function () { innskraning(); });
      });
    });
  }

  $('#inni').innerHTML = '<div class="sent"><p class="meta">Hleð…</p></div>';
  api('GET').then(function (st) {
    if (st.authed) { location.replace(nextUrl()); return; }
    if (!st.configured) { setTitle('Ekki sett upp'); $('#inni').innerHTML = '<div class="sent"><p class="meta">Innskráning er ekki sett upp enn. Biddu admin að ljúka uppsetningu í Brunahólfi.</p><a class="alt" href="/">Áfram í appið</a></div>'; return; }
    innskraning();
  }).catch(function () { $('#inni').innerHTML = '<div class="sent"><p class="meta">Næ ekki sambandi við þjóninn.</p><a class="alt" href="/">Áfram í appið</a></div>'; });
})();
</script>
</body>
</html>
