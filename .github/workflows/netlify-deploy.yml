name: Deploy to Netlify

# Auto-deploy slokkvitaeki.netlify.app on every push to master.
# Two secrets are required in this repo's GitHub settings → Secrets and variables → Actions:
#   - NETLIFY_AUTH_TOKEN  (create at https://app.netlify.com/user/applications#personal-access-tokens)
#   - NETLIFY_SITE_ID     (= d22039b2-75f2-4206-b543-7c6176f2d181)

on:
  push:
    branches:
      - master
  workflow_dispatch:        # also allow manual triggering from the Actions tab

concurrency:
  group: netlify-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@latest

      - name: Deploy to production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID:    ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          netlify deploy \
            --dir=. \
            --prod \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="GHA: ${{ github.event.head_commit.message }}"
