name: Deploy to Netlify

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node deploy.js
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
