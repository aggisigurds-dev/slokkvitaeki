name: Öryggisnet

# Keyrir ALLA verði (tools/audit-*.cjs) við hverja ýtingu á master.
#
# Af hverju þetta flæði er til (09.09.2026): audit-all.cjs sagði í hausnum
# "run before every push" og keyrði hvergi — hvorki í CI, git-hook né npm-skripti.
# 33 verðir skrifaðir, enginn tengdur. Þess vegna komu sömu villurnar aftur.
#
# ÞETTA KOSTAR ENGAR NETLIFY-KRÍTUR.
# deploy.yml birtir aðeins þegar haus-commit ber [deploy] (07.09: 1.031 deploy
# = 15.465 krítur ≈ 10$ á dag). Þetta flæði BIRTIR EKKERT — það keyrir Node og
# les gögn. GitHub Actions-mínútur eru ókeypis á þessum skala. Hliðið í
# deploy.yml er ósnert.
#
# Verkaskipting við pre-push-hookinn (.githooks/pre-push):
#   hookurinn  kóða-verðirnir, ~2,5 s, án nets — stöðvar ýtingu strax
#   þetta      allir, líka þeir sem spyrja Supabase — grípur gagnavillur
#
# ── 18.09.2026: GAGNAVERÐIR FELLA EKKI LENGUR KEYRSLUNA ────────────────────────
# Agnar: „síðan er maður að fá stanslaust af þessu" — 12+ „Run failed"-póstar á
# einum degi, einn á hverja ýtingu.
#
# Rótin: `audit-all.cjs:93` fellir keyrsluna ef EINHVER vörður er rauður, og
# fjórir GAGNAverðir eru rauðir þessa dagana (ótengdir kreditreikningar, sölur án
# tengingar, T=S-frávik, samþykkt vinnublöð án sölu). Ekkert af því orsakast af
# ýtingunni — það er ástand í gagnagrunninum sem stendur óbreytt milli commita.
# Niðurstaðan var póstur á hverja ýtingu um sama óbreytta ástandið, sem kennir
# manni að eyða póstinum óopnuðum. Þá sést ekki þegar KÓÐINN brotnar.
#
# Skiptingin sem gildir hér:
#   kóða-verðir  → mega fella. Ýtingin orsakaði þá, og þá á að stöðva hana.
#   gagna-verðir → mega ekki fella. Þeir mæla ástand sem ýtingin snerti ekki.
#                  Niðurstaðan fer áfram í `oryggisnet_keyrslur` (--skra), þar sem
#                  hana má lesa í appinu í stað pósthólfsins.
#
# Þetta er EKKI þöggun: mælingin keyrir óbreytt, talan er skráð óbreytt, og rauður
# gagnavörður birtist sem ⚠ í samantekt keyrslunnar. Það sem breytist er að hann
# sendir ekki póst sem segir „bilað" um eitthvað sem var eins fyrir ýtinguna.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: oryggisnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verdir:
    runs-on: ubuntu-latest
    # Sleppa wip-commitum sjálfvirku samstillingarinnar (15 mín fresti) — þau eru
    # vistun milli vélanna fjögurra, ekki vinna sem er verið að skila.
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[skip ci]')

    # `secrets`-samhengið er EKKI aðgengilegt í `if:` á þrepi — `env` er það.
    # Lykillinn er því settur hér einu sinni og þrepin prófa `env`.
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      # fetch-depth: 0 — ÓMISSANDI. Sjálfgefinn grunnur klón (depth 1) skilar
      # HEAD-dagsetningu úr `git log -1 -- <skrá>` fyrir HVERJA skrá, og þá sér
      # audit-utgafumerki allar stakar skriftur sem „breyttar í dag" og fellur.
      # Það felldi hverja einustu keyrslu þar til þetta fannst 18.09.2026.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Blokkerandi: þessir lesa KÓÐANN sem var verið að ýta. Falli þeir er það
      # ýtingin sem olli því, og þá á keyrslan að falla.
      - name: Kóða-verðir (engin gagnatenging)
        run: node tools/audit-all.cjs --static

      # 23.09.2026 — ÞETTA ÞREP ÞAGGAÐI NIÐUR ALLT ÖRYGGISNETIÐ Í VIKU.
      # Skilyrðið `if: SUPABASE_SERVICE_ROLE_KEY != ''` hér að neðan sleppti gagnavörðunum ALVEG þegar leyndarmálið
      # vantaði. Það hvarf úr repóinu (aðeins NETLIFY_* eru eftir) og 16.09. kl. 17:57 skrifaðist síðasta röðin í
      # `oryggisnet_keyrslur`. Keyrslan hélt samt áfram að skila ✅, svo ekkert sást: Jarvis-síðan sýndi 49/53 græna
      # og „2 brotnir" í sex daga á meðan raunveruleikinn var 59/64 og 5 brotnir — og ellefu nýir verðir sáust hvergi.
      # Lykillinn er ÓÞARFUR: tools/audit-all.cjs fellur aftur á anon-lykilinn í js/config.js (línur 89–91), og sú leið
      # var prófuð 23.09. — 64 raðir skrifuðust. Skilyrðið er því farið; þrepið keyrir alltaf.
      #
      # Ekki blokkerandi: þessir mæla ÁSTAND GAGNA sem ýtingin snerti ekki.
      # Niðurstaðan er skráð í oryggisnet_keyrslur hvort sem hún er græn eða rauð.
      - name: Gagna-verðir (fella ekki keyrsluna — sjá haus)
        id: gogn
        continue-on-error: true
        run: node tools/audit-all.cjs --skra --uppruni=ci

      # Skráðist keyrslan? Án þessa er þögn óaðgreinanleg frá „allt í lagi" — og það var einmitt bilunin.
      - name: Skráðist keyrslan í öryggisnetið?
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const cfg = fs.readFileSync("js/config.js", "utf8");
            const url = (cfg.match(/SUPABASE_URL\s*=\s*["\x27]([^"\x27]+)/) || [])[1];
            const key = process.env.SUPABASE_SERVICE_ROLE_KEY || (cfg.match(/SUPABASE_KEY\s*=\s*["\x27]([^"\x27]+)/) || [])[1];
            fetch(url + "/rest/v1/oryggisnet_keyrslur?select=timi&order=timi.desc&limit=1", { headers: { apikey: key, Authorization: "Bearer " + key } })
              .then(r => r.json())
              .then(j => {
                const timi = j && j[0] && j[0].timi;
                const min = timi ? (Date.now() - Date.parse(timi)) / 60000 : Infinity;
                if (min > 180) {
                  console.log("::warning title=Öryggisnetið skráist ekki::Nýjasta keyrslan í oryggisnet_keyrslur er " +
                    (isFinite(min) ? Math.round(min / 60) + " klst" : "ENGIN") + " gömul — Jarvis-síðan sýnir úreltar tölur.");
                } else {
                  console.log("✅ Skráð fyrir " + Math.round(min) + " mín — Jarvis sýnir þessa keyrslu.");
                }
              })
              .catch(e => console.log("::warning title=Öryggisnetið::Náði ekki að staðfesta skráningu: " + e.message));
          ' >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      - name: Samantekt
        if: always()
        run: |
          echo "✅ Kóða-verðir: grænt (annars hefði keyrslan fallið hér að ofan)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.gogn.outcome }}" = "failure" ]; then
            echo "::warning title=Rauður gagnavörður::Ástand í gögnunum er rautt. Það stöðvar ekki ýtinguna — sjá oryggisnet_keyrslur."
            echo "⚠ Gagnaverðir: RAUTT — ástand gagna, ekki þessi ýting" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.gogn.outcome }}" = "skipped" ]; then
            echo "⏭ Gagnaverðir: SLEPPT — það á ekki að geta gerst lengur (skilyrðið var fjarlægt 23.09.2026)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ Gagnaverðir: grænt" >> "$GITHUB_STEP_SUMMARY"
          fi
