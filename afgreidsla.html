  Agnar 15.11.2026: „bara ýtt á staðfesta eða senda" — og um gamla kerfið: „óskýrt … ekki nægilegar sannanir eða rök …
  rennur svo mikið saman. Treysti því ekki." Því: EITT mál í einu, „Hvað gerist þegar þú ýtir" efst, sannanir og
  athuganir (✓/✗) sýnilegar, og takkinn segir nákvæmlega hvað hann gerir. Tvö tök á takkann (vopna → staðfesta).
  Gögn: /api/afgreidsla (netlify/functions/afgreidsla.cjs) — aðeins innskráður stjórnandi. Útlit: Brunahólf V2 / Tillaga B
  frá 17.11.2026 (áður Brunastál C) — sjá athugasemdina efst í <style>.
  Stöðugt viðmót: spjaldið fær fasta lágmarkshæð, textareiturinn er aldrei endurteiknaður meðan skrifað er.
  16.11.2026 (Agnar: „heimilaðu mér að geta opnað [skýrslur og reikninga] til að staðfesta, og í afgreiðslu að hafa
  heildarpunktana til hliðar svo ég geti skippað á milli, eða valið flokka, eða sett athugasemd"): listi allra verka til
  hliðar (á síma ofan við spjaldið) með flokkasíu, hver heimild með slóð opnar skjalið sjálft (reikningur/skýrsla sem PDF,

:root{

</style>
