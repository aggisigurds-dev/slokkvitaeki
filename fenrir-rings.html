<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FENRIR — Apocalypse Ring Lab</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Rajdhani:wght@400;600;700&display=swap');
:root{color-scheme:dark;--speed:1;--glow:1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 10%,#61231188,transparent 55%),#080a0e;color:#f6e8d5;font:17px Rajdhani,Arial}header{padding:24px 4vw;border-bottom:1px solid #89512f;background:#090c12c9;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}h1,h2{font-family:Cinzel,serif;color:#ffd18b}h1{margin:0;font-size:clamp(25px,4vw,40px)}a{color:#ffbd6a}main{max-width:1450px;margin:auto;padding:24px 4vw}.intro{color:#bba894}.controls{display:flex;flex-wrap:wrap;gap:18px;align-items:center;background:#121720;border:1px solid #76502e;padding:15px;border-radius:10px;margin:18px 0 24px}.controls label{display:flex;align-items:center;gap:8px}.controls input[type=range]{accent-color:#ffae4c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}.tile{background:linear-gradient(140deg,#161c26,#080a0e);border:1px solid #765032;border-radius:13px;overflow:hidden}.stage{height:340px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(ellipse at center,#2a1715 0%,#0c1119 55%,#07090d 100%)}.stage:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 34px,#ffae2710 35px),repeating-linear-gradient(90deg,transparent 0 34px,#ffae2710 35px);mask-image:radial-gradient(circle,black,transparent 70%)}.ring{--c:#ffb84e;--c2:#ff6b20;--period:18s;position:relative;width:250px;height:250px;border-radius:50%;display:grid;place-items:center;filter:drop-shadow(0 0 calc(18px * var(--glow)) var(--c2));isolation:isolate}.ring .outer,.ring .middle,.ring .inner,.ring .sweep,.ring .core,.ring .glyphs,.ring .sparks{position:absolute;border-radius:50%;inset:0}.outer{border:3px solid var(--c);box-shadow:0 0 16px var(--c),inset 0 0 18px var(--c2);background:repeating-conic-gradient(from 10deg,var(--c) 0 1deg,transparent 1deg 14deg);mask-image:radial-gradient(circle,transparent 0 81%,black 82%)}.middle{inset:18px!important;border:3px dashed var(--c);box-shadow:0 0 12px var(--c);animation:rotate var(--period) linear infinite}.inner{inset:39px!important;border:4px double var(--c2);box-shadow:inset 0 0 25px var(--c2),0 0 15px var(--c);animation:rotate calc(var(--period) * -1.6) linear infinite}.sweep{inset:13px!important;background:conic-gradient(from 0deg,transparent 0 280deg,var(--c2) 348deg,transparent 360deg);opacity:.25;mask-image:radial-gradient(circle,transparent 0 63%,black 72%);animation:rotate calc(var(--period) * .8) linear infinite}.glyphs{inset:6px!important;display:grid;place-items:start center;animation:rotate calc(var(--period) * -2.5) linear infinite;color:var(--c);font-size:21px;text-shadow:0 0 10px var(--c)}.glyphs:before{content:"ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ";position:absolute;top:4px;letter-spacing:9px;font-size:10px;left:35px}.glyphs:after{content:"ᚷ ᚹ ᛉ ᛋ ᛏ";position:absolute;bottom:4px;letter-spacing:10px;font-size:10px;left:48px}.core{inset:66px!important;display:grid;place-items:center;background:radial-gradient(circle,#25140f,#090a0e 72%);border:1px solid var(--c);box-shadow:0 0 22px var(--c2),inset 0 0 16px var(--c2);z-index:2}.core span{text-align:center;font:800 22px Cinzel;color:var(--c);text-shadow:0 0 15px var(--c)}.core small{display:block;font:600 10px Rajdhani;letter-spacing:2px}.sparks{background:repeating-conic-gradient(from 20deg,transparent 0 26deg,var(--c) 27deg,transparent 28deg 52deg);mask-image:radial-gradient(circle,transparent 0 95%,black 98%);animation:rotate calc(var(--period) * .5) linear infinite;opacity:.8}.ring.blood{--c:#ff4b39;--c2:#b8091a;--period:30s}.ring.blood .core{background:radial-gradient(circle at 55% 35%,#a50f16,#120508 65%)}.ring.inferno{--c:#ffd063;--c2:#ff4a08;--period:9s}.ring.inferno .outer{border-width:6px}.ring.storm{--c:#61d8ff;--c2:#126fff;--period:12s}.ring.storm .sweep{opacity:.6}.ring.unchained{--c:#ffad42;--c2:#e31619;--period:7s}.ring.unchained .middle{border-style:dotted;border-width:5px}.ring.void{--c:#d7e3f4;--c2:#57657b;--period:40s}.ring.void .sweep{opacity:.1}.tile footer{padding:15px 17px}.tile h2{margin:0 0 5px;font-size:18px}.tile p{margin:0 0 12px;color:#b5a596;font-size:15px}.buttons{display:flex;gap:8px;flex-wrap:wrap}button{background:#302017;color:#ffce90;border:1px solid #9d6634;border-radius:6px;padding:8px 12px;cursor:pointer;font:700 15px Rajdhani}button:hover{background:#683015}.demo .ring{animation:surge 1s ease-in-out 2}.paused *{animation-play-state:paused!important}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes surge{50%{filter:drop-shadow(0 0 45px var(--c));transform:scale(1.045)}}@media(prefers-reduced-motion:reduce){.ring *,.ring{animation:none!important}}@media(max-width:420px){.grid{grid-template-columns:1fr}.stage{height:300px}.ring{transform:scale(.87)}}
</style></head><body><header><div><h1>ᚠ FENRIR — RING LAB</h1><div class="intro">RAGNARÖK DESIGN SYSTEM · ANIMATED APOCALYPSE CORES</div></div><div><a href="fenrir-assets.html">Asset Vault</a> · <a href="fenrir.html">Dashboard</a></div></header><main><p class="intro">Six working animated ring variants. Select a mode, trigger an alarm pulse, pause motion, or adjust speed and glow. Animation runs locally in CSS.</p><section class="controls"><label>Motion speed <input type="range" id="speed" min="25" max="250" value="100"><span id="speedlabel">100%</span></label><label>Glow <input type="range" id="glow" min="0" max="250" value="100"><span id="glowlabel">100%</span></label><button id="pause">Ⅱ Pause all</button><button id="pulse">⚡ Pulse all</button></section><section class="grid" id="grid"></section></main><script>
const variants=[['gold','Golden Ragnarök','Golden energy, runic orbit and solar scan'],['blood','Blood Eclipse','Red corona and ominous eclipse core'],['inferno','Inferno Reactor','High-speed molten turbine'],['storm','Stormbreaker','Electric-blue radar and storm arcs'],['unchained','Fenrir Unchained','Aggressive broken-chain energy'],['void','Void Sentinel','Silver stealth ring with slow orbit']];
const grid=document.getElementById('grid');grid.innerHTML=variants.map(([id,name,desc])=>'<article class="tile"><div class="stage" id="stage-'+id+'"><div class="ring '+id+'" id="ring-'+id+'"><div class="outer"></div><div class="middle"></div><div class="inner"></div><div class="sweep"></div><div class="glyphs"></div><div class="sparks"></div><div class="core"><span>ᚠ<small>FENRIR</small></span></div></div></div><footer><h2>'+name+'</h2><p>'+desc+'</p><div class="buttons"><button data-pulse="'+id+'">⚡ Trigger pulse</button><button data-copy="'+id+'">Copy variant ID</button></div></footer></article>').join('');
grid.onclick=e=>{const p=e.target.closest('[data-pulse]'),c=e.target.closest('[data-copy]');if(p){const s=document.getElementById('stage-'+p.dataset.pulse);s.classList.remove('demo');void s.offsetWidth;s.classList.add('demo')}if(c){navigator.clipboard?.writeText('fenrir-ring-'+c.dataset.copy);c.textContent='Copied!';setTimeout(()=>c.textContent='Copy variant ID',1000)}};const speed=document.getElementById('speed'),glow=document.getElementById('glow');function update(){const v=Number(speed.value)/100;document.querySelectorAll('.ring').forEach(r=>r.style.setProperty('--period',(parseFloat(getComputedStyle(r).getPropertyValue('--period'))||18)/v+'s'));document.getElementById('speedlabel').textContent=speed.value+'%'}const bases={gold:18,blood:30,inferno:9,storm:12,unchained:7,void:40};speed.oninput=()=>{document.querySelectorAll('.ring').forEach(r=>r.style.setProperty('--period',bases[variants.find(x=>r.classList.contains(x[0]))[0]]/(Number(speed.value)/100)+'s'));document.getElementById('speedlabel').textContent=speed.value+'%'};glow.oninput=()=>{document.documentElement.style.setProperty('--glow',glow.value/100);document.getElementById('glowlabel').textContent=glow.value+'%'};document.getElementById('pause').onclick=e=>{document.body.classList.toggle('paused');e.target.textContent=document.body.classList.contains('paused')?'▶ Resume all':'Ⅱ Pause all'};document.getElementById('pulse').onclick=()=>document.querySelectorAll('.stage').forEach(s=>{s.classList.remove('demo');void s.offsetWidth;s.classList.add('demo')});
</script></body></html>
