# Netlify configuration for Slökkvitæki.

# --- DEPLOY: báðar leiðir birta SAMA dist ------------------------------------
# Tvær deploy-leiðir keyra við hverja ýtingu á master:
#   1. GitHub Actions  → build-dist.js → netlify-cli deploy dist/ + functions
#   2. Netlify Git-tenging → [build] hér að neðan → sama build-dist.js → dist/
# Áður hafði leið 2 ekkert [build] og birti RÓT verkefnisins (allt með, óbundlað)
# — sú sem kláraðist SÍÐAST vann, svo framleiðslan flakkaði milli bundlaðrar og
# hrárrar útgáfu (og /CLAUDE.md flakkaði milli 404 og 200 þar til redirect-
# reglurnar að neðan lokuðu því). Með [build] búa báðar leiðir til nákvæmlega
# sama úttak svo röðin skiptir ekki lengur máli. Deploy-preview á PR-um keyra
# líka build-dist núna — forskoðunin er eins og framleiðslan.
# Fail-safe: klikki Netlify-buildið birtist ekkert úr þeirri leið (site stendur
# á síðasta góða deployi) og Actions-leiðin heldur áfram að virka óbreytt.
[build]
  command = "node build-dist.js"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# --- ÖRYGGI: innri skrár ALDREI birtar --------------------------------------
# dist/ inniheldur hvorki *.md, *.sql né _*-skrár (build-dist síar), en þessar
# reglur standa áfram sem vörn í dýpt — og verða að standa FREMST í
# redirect-röðinni; Netlify tekur fyrstu reglu sem passar.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/BACKLOG.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.mcp.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/deploy.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/build-dist.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/backup-supabase.mjs"
  to = "/404.html"
  status = 404
  force = true

# Route /api/* to the Netlify Functions under netlify/functions/*.js
# e.g. /api/geocode -> /.netlify/functions/geocode
# Clean alias for the bulk-geocode background function (must precede the wildcard).
[[redirects]]
  from = "/api/geocode-all"
  to = "/.netlify/functions/geocode-all-background"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# /opp -> the „📱 Öpp" launcher. The apps live under /app/<key>/ (below), but the
# launcher page itself is a hash view (#opp), so a bare /opp used to 404. Old
# bookmarks / home-screen shortcuts and anyone typing the obvious URL land here.
[[redirects]]
  from = "/opp"
  to = "/#opp"
  status = 302

# Installable mini-apps get their OWN path + PWA scope (/app/<key>/) so no app
# claims the whole origin ("/") and they can be installed side-by-side without
# Chrome collapsing them into one ("open in Fjármál" everywhere). Each path
# serves the same SPA; the app boots into the right profile from the pathname.
[[redirects]]
  from = "/app/*"
  to = "/index.html"
  status = 200

# Always revalidate the HTML entry points so a new deploy is picked up across
# machines. JS/CSS are cache-busted via hand-written ?v= query strings.
#
# 2026-06-13: the rule was scoped to "/index.html", but the app is opened at
# "/" — Netlify matches header rules by REQUEST path, so the root document "/"
# fell through to the default long cache. That stranded users on stale cached
# JS for every deploy (the recurring "fixes don't show up" gremlin). Cover the
# root and every *.html page so the entry document always revalidates.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The mini-app paths serve index.html via rewrite — revalidate them too.
[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sjálfvirk greiðslu-samstilling úr Payday tvisvar á dag: kl. 10:00 og 15:00
# (cron er í UTC; Ísland = UTC allt árið → sömu tímar að staðartíma). Sami
# vinnsluferill og 🔄 takkinn á Kröfu yfirlit.
[functions."payday-sync-cron"]
  schedule = "0 10,15 * * *"

# Myndlýsing á Verkefnalistanum á 15 mín fresti: skjámynd sem límd er á verk fær
# íslenska lýsingu í claude_notes svo næsti agent sjái hvað er á henni. Sópunin
# tekur 5 verk í senn og gerir ekkert þegar ekkert nýtt er (ein Supabase-fyrirspurn).
[functions."verkefnalisti-vision-cron"]
  schedule = "*/15 * * * *"
